<style>

.neg{color:var(--bad)}.pos{color:var(--ok)}

.em{text-align:center;padding:36px 10px;font-size:42px}.em p{font-size:14px;margin-top:6px;color:var(--mu)}
#to{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:11px 18px;border-radius:22px;display:none;z-index:9;box-shadow:0 6px 20px #0005}
#cl{position:fixed;top:calc(10px + env(safe-area-inset-top));right:14px;z-index:4;width:40px;height:40px;border-radius:13px;border:0;background:var(--card);box-shadow:var(--sh);font-size:19px;opacity:.65}#cl.ok{opacity:1;box-shadow:0 0 0 2px var(--ok)}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--bd)}
button,.c[onclick]{transition:transform .15s,box-shadow .15s,filter .15s}button:active{transform:scale(.96)}
@media(hover:hover){button{cursor:pointer}.btn:hover,.fab:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 14px 28px #0005;filter:brightness(1.1)}
nav button:hover,.chips button:hover,.seg button:hover,#cl:hover{transform:translateY(-3px);box-shadow:0 8px 18px #0003;opacity:1}.sw:hover{transform:scale(1.18)}.c[onclick]:hover{transform:translateY(-2px);box-shadow:0 10px 24px #0002}}
#app .fl{animation:fl 1.8s}@keyframes fl{0%,60%{box-shadow:0 0 0 3px var(--pr)}}
.mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:20px 2px 8px;flex-wrap:wrap}.mh b{font-size:16px}
summary{font-weight:700;cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}summary:after{content:"▾";float:right;color:var(--mu)}details[open] summary:after{content:"▴"}
.av,.hero,.g3 .c{cursor:pointer}nav span{font-size:19px}
.bkb{border:0;background:none;color:var(--pr);font-weight:700;font-size:15px;padding:2px 0 10px}
.btn.alt{background:var(--pr2);color:var(--pr);box-shadow:none;margin-top:10px}.btn.dng{background:#e11d4820;color:var(--bad);box-shadow:none;margin-top:10px}
.c[onclick]:active,.hero:active,.av:active,.sw:active,.chips button:active,nav button:active{transform:scale(.95)}
</style></head><body>
<button id="cl" onclick="cloud()" title="Conexión con Firebase">☁️</button><main id="app"></main><button class="fab" id="fab" onclick="fab()">+</button><nav id="nav"></nav><div id="sh"></div><div id="to"></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),today=()=>new Date().toISOString().slice(0,10),ym=()=>today().slice(0,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),vis=a=>a.filter(x=>!x.del),srt=a=>[...a].sort((x,y)=>x.id<y.id?-1:1);
const rd=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
let D=rd('gd',{accs:[],txs:[],svcs:[],mem:[]}),cfg=rd('gc',{user:'',fb:''});D.mem=D.mem||[];cfg.home=cfg.home||{};
const CAT={Comida:'🛒',Hogar:'🏠',Servicios:'💡',Transporte:'🚗',Salud:'💊',Ocio:'🎉',Compras:'🛍️',Deudas:'💳',Sueldo:'💼',Otros:'📦'};
const TYP={corriente:['🏦','Cuenta corriente'],ahorro:['🐖','Caja de ahorro'],efectivo:['💵','Efectivo'],digital:['📱','Billetera digital'],tarjeta:['💳','Tarjeta de crédito'],prestamo:['🤝','Préstamo'],cuotas:['🛒','Objeto a cuotas'],seguro:['🩺','Seguro médico'],inversion:['📈','Fondo de inversión'],otra:['📌','Otra deuda']};
const fm=(n,c)=>(n<0?'−':'')+(c=='USD'?'US$ '+Math.abs(n).toLocaleString('es-PY',{minimumFractionDigits:2,maximumFractionDigits:2}):'₲ '+Math.round(Math.abs(n)).toLocaleString('es-PY'));
function num(s){s=String(s||'').trim().replace(/[^\d.,]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/\.\d{3}(\.|$)/.test(s))s=s.replace(/\./g,'');return parseFloat(s)||0}
function toast(m){const t=$('#to');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function sheet(h){$('#sh').innerHTML='<div class=bk onclick=closeS()></div><div class=pn><button class=bkb onclick="closeS()">‹ Volver</button>'+h+'</div>';$('#sh').classList.add('on')}
function closeS(){$('#sh').classList.remove('on')}
const fld=(l,i)=>`<label>${l}</label>${i}`;
/* ---------- datos + sync ---------- */
const ser=()=>JSON.stringify({accs:srt(D.accs),txs:srt(D.txs),svcs:srt(D.svcs),mem:srt(D.mem)});
function merge(r){for(const k of['accs','txs','svcs','mem']){const m=new Map(D[k].map(x=>[x.id,x]));(r[k]||[]).forEach(x=>{const l=m.get(x.id);if(!l||x.u>l.u)m.set(x.id,x)});D[k]=srt([...m.values()])}localStorage.setItem('gd',JSON.stringify(D))}
let db,ref,usr,unsub,st='Solo en este dispositivo',t0;
const em=e=>e.code=='unavailable'?'Sin conexión':'Error: '+(e.code||e.message);
function setSt(s){st=s;const c=$('#cl');if(c)c.className=s[0]=='✓'?'ok':''}
function save(){localStorage.setItem('gd',JSON.stringify(D));push()}
function push(){if(!ref)return;clearTimeout(t0);t0=setTimeout(()=>db.runTransaction(async t=>{const s=await t.get(ref);if(s.exists)merge(JSON.parse(s.data().d));t.set(ref,{d:ser()})}).then(()=>setSt('✓ Sincronizado')).catch(e=>{const m=em(e);if(st!=m)toast('Sincronización: '+m.replace('Error: ',''));setSt(m);setTimeout(push,20000)}),400)}
addEventListener('online',push);
const lsc=u=>new Promise((r,j)=>{const s=document.createElement('script');s.src=u;s.onload=r;s.onerror=j;document.head.appendChild(s)});
const VER='v10',pidIn=t=>{const m=t.match(/projectId["']?\s*:\s*["']([^"']+)/)||t.match(/authDomain["']?\s*:\s*["']([^."']+)\./);return m?m[1]:''},pidOf=()=>pidIn(cfg.fb||'');
function showPid(v){const e=$('#pid');if(e)e.value=pidIn(v)}
async function refreshApp(){try{for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();for(const k of await caches.keys())await caches.delete(k)}catch(e){}location.reload()}
function parseFb(t){const o={},K=['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId','measurementId'];
 for(const m of t.matchAll(/["']?(\w+)["']?\s*:\s*["']([^"']*)["']/g))if(K.includes(m[1]))o[m[1]]=m[2];
 if(!o.apiKey||!o.projectId)throw Error('La configuración está incompleta: faltan apiKey o projectId');return o}
async function boot(){if(!cfg.fb)throw Error('Primero configurá Firebase con el ícono ☁️');const B='https://www.gstatic.com/firebasejs/10.12.2/firebase-';
 if(!window.firebase){await lsc(B+'app-compat.js');await lsc(B+'auth-compat.js');await lsc(B+'firestore-compat.js')}
 if(!firebase.apps.length)firebase.initializeApp(parseFb(cfg.fb));db=firebase.firestore()}
async function initSync(){if(!cfg.fb||!on())return;try{setSt('Conectando…');await boot();
 usr=await new Promise(r=>{const o=firebase.auth().onAuthStateChanged(x=>{o();r(x)})});if(!usr)return setSt('Sesión vencida: volvé a ingresar');cfg.user=NM[(usr.email||'').toLowerCase()]||cfg.user;localStorage.setItem('gc',JSON.stringify(cfg));
 ref=db.collection('hogares').doc('hogar');unsub&&unsub();
 unsub=ref.onSnapshot(s=>{if(s.exists){merge(JSON.parse(s.data().d));normNames();render();if(s.data().d!=ser())push();else setSt('✓ Sincronizado')}else push()},e=>{setSt(em(e));toast('Sincronización: '+(e.code||e.message))})}catch(e){setSt(em(e))}}
function upsert(k,o){o.u=Date.now();const i=D[k].findIndex(x=>x.id==o.id);i<0?D[k].push(o):D[k][i]=o;save()}
function del(k,id){const o=D[k].find(x=>x.id==id);if(o&&confirm('¿Eliminar?')){o.del=1;upsert(k,o);render()}}
/* ---------- cálculos ---------- */
const acc=id=>D.accs.find(a=>a.id==id),me=()=>cfg.user?cfg.user[0].toUpperCase()+cfg.user.slice(1):'Yo';
function bal(a){let b=a.open||0;vis(D.txs).forEach(t=>{if(t.acc==a.id)b+=t.type=='ingreso'?t.amount:-t.amount;if(t.to==a.id)b+=t.toAmt||t.amount});return b}
const spend=(f,c)=>vis(D.txs).filter(t=>t.type=='gasto'&&t.date.startsWith(ym())&&acc(t.acc)?.cur==c&&f(t)).reduce((s,t)=>s+t.amount,0);
/* ---------- vistas ---------- */
let T='in',flt='all',F={};
const TABS=[['in','🏠','Inicio'],['mv','🧾','Movs'],['cu','👛','Cuentas'],['de','💳','Deudas'],['sv','💡','Servicios'],['aj','⚙️','Opciones']];
function render(){const lg=!on();$('#nav').style.display=lg?'none':'flex';$('#cl').style.display=lg?'block':'none';$('#app').style.paddingTop=lg?'':'22px';
 if(lg){$('#fab').style.display='none';$('#app').innerHTML=loginView();return}
 $('#app').innerHTML={in:home,mv:movs,cu:cuentas,de:deudas,sv:servs,aj:sets}[T]();
 $('#nav').innerHTML=TABS.map(([k,i,l])=>`<button class="${T==k?'on':''}" onclick="T='${k}';render()"><span>${i}</span>${l}</button>`).join('');$('#fab').style.display=T=='aj'?'none':'block'}
function fab(){({in:newTx,mv:newTx,cu:()=>newAcc('cta'),de:()=>newAcc('deu'),sv:newSvc})[T]()}
const on=()=>sessionStorage.getItem('ses')=='1'&&cfg.user,MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'],mlab=m=>MES[+m.slice(5)-1]+' '+m.slice(0,4);
const NM={'gyanmelgarejo@gmail.com':'Gyan','fiorelladomin@gmail.com':'Fio'},UE={gyan:'gyanmelgarejo@gmail.com',fio:'fiorelladomin@gmail.com'},part=()=>({Gyan:'Fio',Fio:'Gyan'})[me()]||(D.mem.find(x=>x.id!=me())||{}).id||'Tu pareja',vacc=()=>vis(D.accs).filter(a=>a.owner=='shared'||who(a.owner)==me()),vsv=()=>vis(D.svcs).filter(s=>s.scope=='shared'||!s.by||who(s.by)==me()),svcDue=s=>s.monthly===0?(!s.paid&&(s.ym||ym())<=ym()):s.paid!=ym(),svcPaid=s=>s.monthly===0?!!s.paid:s.paid==ym(),deb=a=>['tarjeta','prestamo','cuotas','seguro','inversion','otra'].includes(a.type);
const sum=(L,ty,c)=>L.filter(t=>t.type==ty&&(acc(t.acc)?.cur||t.cur)==c).reduce((s,t)=>s+t.amount,0);
const emp=(i,t)=>`<div class=em>${i}<p>${t}</p></div>`;
function ensureMem(){if(!D.mem.some(x=>x.id==me()))upsert('mem',{id:me()})}
function owes(){const m=me(),r={PYG:0,USD:0};vis(D.txs).forEach(t=>{if(t.type=='gasto'&&t.scope=='shared'&&t.pays&&t.pays!='me'){const c=acc(t.acc)?.cur||'PYG',x=t.pays=='half'?t.amount/2:t.amount;r[c]+=t.by==m?x:-x}if(t.type=='saldo')r[t.cur]+=t.by==m?t.amount:-t.amount});return r}
const who=n=>/^gyan/i.test(n||'')?'Gyan':/^fio/i.test(n||'')?'Fio':n;
function normNames(){let ch=0;for(const k of['accs','txs','svcs'])D[k].forEach(o=>{const f=k=='accs'?'owner':'by';if(o[f]&&who(o[f])!==o[f]){o[f]=who(o[f]);o.u=Date.now();ch=1}});if(ch)save()}
const nf=n=>{const[i,d]=String(n).split('.');return i.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+(d?','+d:'')};
function fmtIn(el){const[i0,d]=el.value.replace(/[^\d,]/g,'').split(',');const i=i0.replace(/^0+(?=\d)/,'').replace(/\B(?=(\d{3})+(?!\d))/g,'.');el.value=d!==undefined?i+','+d.slice(0,2):i;return el.value}
const grp=(L,f)=>{const g={};L.forEach(x=>{const n=f(x),k=n.toLowerCase();(g[k]=g[k]||{n,L:[]}).L.push(x)});return Object.values(g).sort((a,b)=>a.n.localeCompare(b.n))},bank=a=>a.type=='efectivo'?'Efectivo':a.name.trim().split(/\s+/)[0]||'Otros',optsOf=(L,v)=>L.map(a=>`<option value="${a.id}" ${a.id==v?'selected':''}>${esc(a.name)}</option>`).join('');
function devolver(c){const r=owes()[c];if(r>=0)return;const L=vis(D.accs).filter(a=>a.cur==c&&!deb(a)),th=L.filter(a=>who(a.owner)==part()),mi=L.filter(a=>who(a.owner)!=part());if(!th.length)return toast(part()+' todavía no tiene una cuenta en '+(c=='USD'?'US$':'₲'));if(!mi.length)return toast('Necesitás una cuenta en '+(c=='USD'?'US$':'₲'));F={dv:c,amount:nf(-r),from:mi[0].id,to:th[0].id};frm=dvf;dvf()}
function dvf(){const L=vis(D.accs).filter(a=>a.cur==F.dv&&!deb(a));sheet(`<h3>Devolver a ${esc(part())}</h3>${fld('Monto',`<input class=amt inputmode=decimal value="${esc(F.amount)}" oninput="F.amount=fmtIn(this)">`)}${fld('Desde mi cuenta',`<select onchange="F.from=this.value">${optsOf(L.filter(a=>who(a.owner)!=part()),F.from)}</select>`)}${fld('Hacia la cuenta de '+part(),`<select onchange="F.to=this.value">${optsOf(L.filter(a=>who(a.owner)==part()),F.to)}</select>`)}<button class=btn onclick="saveDv()">Devolver</button>`)}
function saveDv(){const amt=num(F.amount);if(!amt)return toast('Ingresá el monto');upsert('txs',{id:uid(),date:today(),type:'transferencia',amount:amt,acc:F.from,to:F.to,cat:'Devolución',note:'Devolución a '+part(),scope:'shared',by:me()});upsert('txs',{id:uid(),date:today(),type:'saldo',amount:amt,cur:F.dv,acc:'',cat:'Saldo',note:'Devolución',scope:'shared',by:me()});closeS();render();toast('Devolución registrada')}
function dueOf(a){const m=ym(),dd=new Date().getDate();
 if(a.cuotero){const q=a.cuotero.find(x=>!x.paid);return q&&q.due.slice(0,7)<=m?{amt:q.amt,lbl:`Cuota ${q.n}/${a.cuotero.length} · vence ${q.due.slice(8)}/${q.due.slice(5,7)}`,day:+q.due.slice(8),od:q.due<today()}:null}
 if(a.paid==m||!a.dueDay)return null;
 if(a.type=='tarjeta')return bal(a)<0?{amt:0,lbl:'vence día '+a.dueDay,day:+a.dueDay,od:+a.dueDay<dd}:null;
 return a.fee&&a.type!='inversion'?{amt:a.fee,lbl:'vence día '+a.dueDay,day:+a.dueDay,od:+a.dueDay<dd}:null}

 sheet(`<h3>${F.id?'Editar':'Nuevo'} movimiento</h3>${seg('type',[['gasto','Gasto'],['ingreso','Ingreso'],['transferencia','Transferir']])}
 ${fld('Monto'+(a?` (${a.cur=='USD'?'US$':'₲'})`:''),`<input class=amt inputmode=decimal value="${esc(F.amount||'')}" oninput="F.amount=fmtIn(this)" placeholder="0">`)}
 ${fld(F.type=='transferencia'?'Desde':'Cuenta',`<select onchange="F.acc=this.value;frm()">${accOpts(F.acc)}</select>`)}
 ${F.type=='transferencia'?fld('Hacia (también para pagar tarjeta o préstamo)',`<select onchange="F.to=this.value;frm()"><option value="">Elegir…</option>${accOpts(F.to)}</select>`)+(cross?fld(`Monto que llega (${b.cur=='USD'?'US$':'₲'})`,`<input inputmode=decimal value="${esc(F.toAmt||'')}" oninput="F.toAmt=fmtIn(this)" placeholder="¿Cuánto llega?">`):''):
 fld('Categoría',`<select onchange="F.cat=this.value">${Object.keys(CAT).map(c=>`<option ${c==F.cat?'selected':''}>${c}</option>`).join('')}</select>`)+fld('¿De quién es?',seg('scope',[['personal','👤 Personal'],['shared','👫 Compartido']]))+(F.type=='gasto'&&F.scope=='shared'?fld('¿Quién paga?',seg('pays',[['me','Pago yo'],['half','50 / 50'],['other','Paga mi pareja']])+`<p class=mu>${{me:'Lo cubrís vos, nadie te debe nada.',half:'Vos pagás el 100% y '+esc(part())+' te devuelve el 50%.',other:'Lo adelantás vos y '+esc(part())+' te devuelve el 100%.'}[F.pays]}</p>`):'')}
 ${fld('Fecha',`<input type=date value="${F.date}" onchange="F.date=this.value">`)}${fld('Nota',`<input value="${esc(F.note||'')}" oninput="F.note=this.value" placeholder="Opcional">`)}<button class=btn onclick="saveTx()">Guardar</button>`)}
function saveTx(){const amt=num(F.amount),a=acc(F.acc);if(!amt)return toast('Ingresá un monto');
 const t={id:F.id||uid(),date:F.date,type:F.type,amount:amt,acc:F.acc,cat:F.cat,note:F.note||'',scope:F.scope,by:F.by||me()};if(F.type=='gasto'&&F.scope=='shared')t.pays=F.pays||'half';
 if(F.type=='transferencia'){const b=acc(F.to);if(!b||b.id==a.id)return toast('Elegí la cuenta destino');t.to=b.id;t.cat='Transferencia';if(a.cur!=b.cur){t.toAmt=num(F.toAmt);if(!t.toAmt)return toast('Ingresá cuánto llega a la otra cuenta')}}
 upsert('txs',t);closeS();render();toast('Guardado')}
function newAcc(k){F={kind:k,type:k=='deu'?'tarjeta':'corriente',cur:'PYG',owner:me(),name:''};frm=accf;accf()}
function accf(){const deu=F.kind=='deu',d=deu&&F.type!='inversion',cq=['prestamo','cuotas'].includes(F.type),g2=(a,b)=>`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div>${a}</div><div>${b}</div></div>`,
 due=fld('Día de vencimiento',`<input type=number min=1 max=31 value="${F.dueDay||''}" oninput="F.dueDay=this.value">`);
 const ex=!deu||F.type=='inversion'?'':cq?g2(fld('Cantidad de cuotas',`<input type=number min=1 value="${F.n||''}" oninput="F.n=this.value">`),fld('Capital de cada cuota',`<input inputmode=decimal value="${esc(F.cm||'')}" oninput="F.cm=fmtIn(this)">`))+g2(fld('Interés por cuota',`<input inputmode=decimal value="${esc(F.int||'')}" oninput="F.int=fmtIn(this)" placeholder="0">`),fld('Primer vencimiento',`<input type=date value="${F.first||''}" onchange="F.first=this.value">`))+'<p class=mu>Después podés ajustar cada cuota en Cuotero.</p>':F.type=='tarjeta'?g2(fld('Día de cierre',`<input type=number min=1 max=31 value="${F.closeDay||''}" oninput="F.closeDay=this.value">`),due):g2(fld('Cuota mensual',`<input inputmode=decimal value="${esc(F.fee||'')}" oninput="F.fee=fmtIn(this)">`),due);
 sheet(`<h3>${F.id?'Editar':'Nueva'} ${deu?'deuda o cuota':'cuenta'}</h3>${fld('Nombre',`<input value="${esc(F.name)}" oninput="F.name=this.value" placeholder="${deu?'Ej: Itaú tarjeta, Continental préstamo':'Ej: Itaú ahorro, Efectivo'}">`)}
 ${fld('Tipo',`<select onchange="F.type=this.value;frm()">${Object.entries(TYP).filter(([k])=>deb({type:k})==deu).map(([k,v])=>`<option value=${k} ${k==F.type?'selected':''}>${v[0]} ${v[1]}</option>`).join('')}</select>`)}
 ${fld('Moneda',seg('cur',[['PYG','₲ Guaraníes'],['USD','US$ Dólares']]))}${fld('Titular',seg('owner',[[me(),'👤 Mía'],['shared','👫 Compartida']]))}
 ${fld(d?'Deuda actual (lo que debés hoy)':F.type=='inversion'?'Monto invertido':'Saldo inicial',`<input inputmode=decimal value="${esc(F.open||'')}" oninput="F.open=fmtIn(this)" placeholder="0">`)}${ex}
 <button class=btn onclick="saveAcc()">Guardar</button>`)}
function saveAcc(){if(!F.name.trim())return toast('Poné un nombre');const old=acc(F.id)||{},d=F.kind=='deu'&&F.type!='inversion',o=Math.abs(num(F.open)),cq=['prestamo','cuotas'].includes(F.type);let cu;
 if(cq&&+F.n&&num(F.cm)&&F.first){const oc=old.cuotero,same=oc&&oc.length==+F.n&&num(F.cm)==(oc[0].cap!=null?oc[0].cap:oc[0].amt)&&num(F.int)==(oc[0].int||0)&&F.first==oc[0].due;
 if(same)cu=oc;else{cu=[];const b=new Date(F.first+'T12:00'),y=b.getFullYear(),m=b.getMonth(),dy=b.getDate();for(let i=0;i<+F.n;i++){const x=new Date(y,m+i,Math.min(dy,new Date(y,m+i+1,0).getDate()),12);cu.push({n:i+1,cap:num(F.cm),int:num(F.int),amt:num(F.cm)+num(F.int),due:x.toISOString().slice(0,10),paid:old.cuotero&&old.cuotero[i]?old.cuotero[i].paid:0})}}}
 upsert('accs',{...old,id:F.id||uid(),name:F.name.trim(),type:F.type,cur:F.cur,owner:F.owner,open:d?-o:o,closeDay:F.closeDay,dueDay:F.dueDay,fee:num(F.fee),cuotero:cu||(cq?old.cuotero:undefined)});closeS();render()}
function newSvc(){if(!vacc().length)return toast('Primero creá una cuenta');F={cur:'PYG',scope:'shared',day:10,monthly:1,ym:ym(),acc:vacc()[0].id};frm=svcf;svcf()}
function svcf(){sheet(`<h3>${F.id?'Editar':'Nuevo'} servicio</h3>${fld('Nombre (ej: Ande luz, Claro internet)',`<input value="${esc(F.name||'')}" oninput="F.name=this.value" placeholder="ANDE, Claro, Tigo…">`)}
 ${fld('Monto',`<input inputmode=decimal value="${esc(F.amount||'')}" oninput="F.amount=fmtIn(this)">`)}${fld('Moneda',seg('cur',[['PYG','₲'],['USD','US$']]))}
 ${fld('Programación',seg('monthly',[[1,'🔁 Programar mensualmente'],[0,'Pago único']]))}${F.monthly==0?fld('Mes del pago',`<input type=month value="${F.ym||ym()}" onchange="F.ym=this.value">`):''}${fld('Día de vencimiento',`<input type=number min=1 max=31 value="${F.day}" oninput="F.day=+this.value">`)}${fld('Se paga desde',`<select onchange="F.acc=this.value">${accOpts(F.acc)}</select>`)}${fld('¿De quién es?',seg('scope',[['personal','👤 Personal'],['shared','👫 Compartido']]))}
 <button class=btn onclick="saveSvc()">Guardar</button>`)}
function saveSvc(){if(!F.name||!num(F.amount))return toast('Completá nombre y monto');const old=D.svcs.find(x=>x.id==F.id)||{};upsert('svcs',{...old,id:F.id||uid(),name:F.name,amount:num(F.amount),cur:F.cur,day:F.day||1,acc:F.acc,scope:F.scope,monthly:F.monthly==0?0:1,ym:F.ym||ym(),by:old.by||me()});closeS();render()}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(on()){normNames();ensureMem()}applyTheme();render();initSync();
</script></body></html>
