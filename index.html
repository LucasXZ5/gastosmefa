<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gastos de a dos</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Gastos">
<style>
:root{--bg:#f4f6f5;--card:#fff;--tx:#14201d;--mu:#6b7a76;--pr:#0f766e;--hero:#0f766e;--pr2:#d5f5ef;--bad:#dc2626;--ok:#16a34a;--bd:#e3e8e6;--r:16px}
@media(prefers-color-scheme:dark){:root{--bg:#0e1514;--card:#17211f;--tx:#e8f0ee;--mu:#8fa09b;--pr:#2dd4bf;--pr2:#134e4a;--bd:#263330}}
*{box-sizing:border-box;margin:0}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);padding-top:env(safe-area-inset-top)}
main{max-width:640px;margin:auto;padding:16px 16px 120px}
h1{font-size:22px;margin-bottom:12px}h3{margin-bottom:10px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.mu{color:var(--mu);font-size:13px}.big{font-size:28px;font-weight:700}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.g3 .c{margin:0;padding:10px}
.hero{background:var(--hero);color:#fff;border:0}.hero .mu{color:#ffffffcc}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:8px 0;font-size:11px}nav button.on{color:var(--pr);font-weight:600}nav span{display:block;font-size:20px}
.fab{position:fixed;right:18px;bottom:calc(72px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--hero);color:#fff;font-size:30px;box-shadow:0 6px 18px #0004}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:8px}.seg button{flex:1;border:0;background:none;padding:8px;border-radius:10px;color:var(--tx);font-size:14px}.seg button.on{background:var(--hero);color:#fff}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--hero);color:#fff;font-weight:600;margin-top:14px;font-size:15px}.btn.s{width:auto;padding:7px 12px;margin:0;font-size:13px}
#sh{display:none;position:fixed;inset:0;z-index:5}#sh.on{display:block}.bk{position:absolute;inset:0;background:#0007}
.pn{position:absolute;bottom:0;left:0;right:0;max-width:640px;margin:auto;background:var(--card);border-radius:20px 20px 0 0;padding:18px;max-height:92vh;overflow:auto}
.chips{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}.chips button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:6px 12px;white-space:nowrap}.chips .on{background:var(--hero);color:#fff;border-color:var(--hero)}
.neg{color:var(--bad)}.pos{color:var(--ok)}
.ic{width:38px;height:38px;border-radius:12px;background:var(--pr2);display:grid;place-items:center;font-size:19px;flex:none}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--pr2);color:var(--pr)}
#to{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;display:none;z-index:9}
</style></head><body>
<main id="app"></main><button class="fab" id="fab" onclick="fab()">+</button><nav id="nav"></nav><div id="sh"></div><div id="to"></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),today=()=>new Date().toISOString().slice(0,10),ym=()=>today().slice(0,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),vis=a=>a.filter(x=>!x.del),srt=a=>[...a].sort((x,y)=>x.id<y.id?-1:1);
const rd=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
let D=rd('gd',{accs:[],txs:[],svcs:[]}),cfg=rd('gc',{name:'',rate:7500,code:'',fb:'',partner:''});
const CAT={Comida:'🛒',Hogar:'🏠',Servicios:'💡',Transporte:'🚗',Salud:'💊',Ocio:'🎉',Compras:'🛍️',Deudas:'💳',Sueldo:'💼',Otros:'📦'};
const TYP={corriente:['🏦','Cuenta corriente'],ahorro:['🐖','Caja de ahorro'],efectivo:['💵','Efectivo'],digital:['📱','Billetera digital'],tarjeta:['💳','Tarjeta de crédito'],prestamo:['🤝','Préstamo / deuda']};
const fm=(n,c)=>(n<0?'−':'')+(c=='USD'?'US$ '+Math.abs(n).toLocaleString('es-PY',{minimumFractionDigits:2,maximumFractionDigits:2}):'₲ '+Math.round(Math.abs(n)).toLocaleString('es-PY'));
function num(s){s=String(s||'').trim().replace(/[^\d.,]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/\.\d{3}(\.|$)/.test(s))s=s.replace(/\./g,'');return parseFloat(s)||0}
function toast(m){const t=$('#to');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function sheet(h){$('#sh').innerHTML='<div class=bk onclick=closeS()></div><div class=pn>'+h+'</div>';$('#sh').classList.add('on')}
function closeS(){$('#sh').classList.remove('on')}
const fld=(l,i)=>`<label>${l}</label>${i}`;
/* ---------- datos + sync ---------- */
const ser=()=>JSON.stringify({accs:srt(D.accs),txs:srt(D.txs),svcs:srt(D.svcs)});
function merge(r){for(const k of['accs','txs','svcs']){const m=new Map(D[k].map(x=>[x.id,x]));(r[k]||[]).forEach(x=>{const l=m.get(x.id);if(!l||x.u>l.u)m.set(x.id,x)});D[k]=srt([...m.values()])}localStorage.setItem('gd',JSON.stringify(D))}
let db,ref,usr,unsub,st='Solo en este dispositivo',t0;
function setSt(s){st=s;if(T=='aj')render()}
function save(){localStorage.setItem('gd',JSON.stringify(D));push()}
function push(){if(!ref)return;clearTimeout(t0);t0=setTimeout(()=>db.runTransaction(async t=>{const s=await t.get(ref);if(s.exists)merge(JSON.parse(s.data().d));t.set(ref,{d:ser(),emails:[...new Set([...(s.exists?s.data().emails:[usr.email]),cfg.partner].filter(Boolean).map(x=>x.toLowerCase()))]})}).then(()=>setSt('✓ Sincronizado')).catch(()=>{setSt('Sin conexión: se reintenta solo');setTimeout(push,15000)}),400)}
addEventListener('online',push);
const lsc=u=>new Promise((r,j)=>{const s=document.createElement('script');s.src=u;s.onload=r;s.onerror=j;document.head.appendChild(s)});
async function initSync(){if(!cfg.fb||!cfg.code)return;try{setSt('Conectando…');const B='https://www.gstatic.com/firebasejs/10.12.2/firebase-';
 if(!window.firebase){await lsc(B+'app-compat.js');await lsc(B+'auth-compat.js');await lsc(B+'firestore-compat.js')}
 const conf=new Function('return '+cfg.fb.slice(cfg.fb.indexOf('{'),cfg.fb.lastIndexOf('}')+1))();
 if(!firebase.apps.length)firebase.initializeApp(conf);usr=await new Promise(r=>{const o=firebase.auth().onAuthStateChanged(x=>{o();r(x)})});if(!usr)return setSt('Iniciá sesión para sincronizar');
 db=firebase.firestore();ref=db.collection('hogares').doc(cfg.code);
 unsub&&unsub();unsub=ref.onSnapshot(s=>{if(s.exists){merge(JSON.parse(s.data().d));render();if(s.data().d!=ser()||(cfg.partner&&!s.data().emails.includes(cfg.partner)))push();else setSt('✓ Sincronizado')}else push()},e=>setSt('Error: '+e.message))}catch(e){setSt('Error: '+e.message)}}
function upsert(k,o){o.u=Date.now();const i=D[k].findIndex(x=>x.id==o.id);i<0?D[k].push(o):D[k][i]=o;save()}
function del(k,id){const o=D[k].find(x=>x.id==id);if(o&&confirm('¿Eliminar?')){o.del=1;upsert(k,o);render()}}
/* ---------- cálculos ---------- */
const acc=id=>D.accs.find(a=>a.id==id),me=()=>cfg.name||'Yo',toP=(n,c)=>c=='USD'?n*cfg.rate:n;
function bal(a){let b=a.open||0;vis(D.txs).forEach(t=>{if(t.acc==a.id)b+=t.type=='ingreso'?t.amount:-t.amount;if(t.to==a.id)b+=t.toAmt||t.amount});return b}
const spend=f=>vis(D.txs).filter(t=>t.type=='gasto'&&t.date.startsWith(ym())&&f(t)).reduce((s,t)=>s+toP(t.amount,acc(t.acc)?.cur),0);
/* ---------- vistas ---------- */
let T=cfg.name?'in':'aj',flt='all',F={};
const TABS=[['in','🏠','Inicio'],['mv','🧾','Movs'],['cu','👛','Cuentas'],['sv','💡','Servicios'],['aj','⚙️','Ajustes']];
function render(){$('#app').innerHTML={in:home,mv:movs,cu:cuentas,sv:servs,aj:sets}[T]();
 $('#nav').innerHTML=TABS.map(([k,i,l])=>`<button class="${T==k?'on':''}" onclick="T='${k}';render()"><span>${i}</span>${l}</button>`).join('');$('#fab').style.display=T=='aj'?'none':'block'}
function fab(){({in:newTx,mv:newTx,cu:newAcc,sv:newSvc})[T]()}
function home(){const A=vis(D.accs),net=c=>A.filter(a=>a.cur==c).reduce((s,a)=>s+bal(a),0),tot=net('PYG')+net('USD')*cfg.rate;
 const sh=spend(t=>t.scope=='shared'),mi=spend(t=>t.scope=='personal'&&t.by==me()),pa=spend(t=>t.scope=='personal'&&t.by!=me());
 const pend=vis(D.svcs).filter(s=>s.paid!=ym()).sort((a,b)=>a.day-b.day),dd=new Date().getDate();
 return `<h1>Hola, ${esc(me())} 👋</h1><div class="c hero"><div class=mu>Patrimonio neto (aprox.)</div><div class=big>${fm(tot,'PYG')}</div><div class=mu>${fm(net('PYG'),'PYG')} · ${fm(net('USD'),'USD')}</div></div>
 <div class=mu style="margin:6px 0">Gastos de este mes</div><div class=g3><div class=c><div class=mu>Compartidos</div><b>${fm(sh,'PYG')}</b></div><div class=c><div class=mu>Míos</div><b>${fm(mi,'PYG')}</b></div><div class=c><div class=mu>Pareja</div><b>${fm(pa,'PYG')}</b></div></div>
 <div class=mu style="margin:6px 0">Servicios por pagar</div>`+(pend.map(s=>`<div class="c row"><div><b>${esc(s.name)}</b><div class=mu>Día ${s.day} ${s.day<dd?'<span class=neg>· vencido</span>':''}</div></div><div><b>${fm(s.amount,s.cur)}</b> <button class="btn s" onclick="payS('${s.id}')">Pagar</button></div></div>`).join('')||'<p class=mu>Todo al día ✓</p>')}
function txRow(t){const a=acc(t.acc),tr=t.type=='transferencia',sg=t.type=='ingreso'?'+':tr?'⇄ ':'−';
 return `<div class="c row" onclick="del('txs','${t.id}')"><div class=ic>${tr?'⇄':CAT[t.cat]||'📦'}</div><div style="flex:1;min-width:0"><b>${esc(t.note||t.cat)}</b><div class=mu>${t.date.slice(5)} · ${esc(a?.name)}${tr?' → '+esc(acc(t.to)?.name):''} · ${esc(t.by)} ${t.scope=='shared'&&!tr?'<span class=tag>Compartido</span>':''}</div></div><b class="${t.type=='ingreso'?'pos':''}">${sg}${fm(t.amount,a?.cur).replace('−','')}</b></div>`}
function movs(){let L=vis(D.txs).sort((a,b)=>b.date.localeCompare(a.date)||b.u-a.u).filter(t=>flt=='all'||(flt=='shared'&&t.scope=='shared')||(flt=='mine'&&t.scope=='personal'&&t.by==me())||(flt=='part'&&t.scope=='personal'&&t.by!=me()));
 return `<h1>Movimientos</h1><div class=chips>${[['all','Todos'],['shared','Compartidos'],['mine','Míos'],['part','Pareja']].map(([k,l])=>`<button class="${flt==k?'on':''}" onclick="flt='${k}';render()">${l}</button>`).join('')}</div>`+(L.map(txRow).join('')||'<p class=mu>Todavía no hay movimientos. Tocá + para agregar.</p>')+'<p class=mu>Tocá un movimiento para eliminarlo.</p>'}
function cuentas(){return `<h1>Cuentas</h1>`+(vis(D.accs).map(a=>{const b=bal(a),[i,l]=TYP[a.type];return `<div class="c row" onclick="del('accs','${a.id}')"><div class=ic>${i}</div><div style="flex:1"><b>${esc(a.name)}</b><div class=mu>${a.owner=='shared'?'Compartida':esc(a.owner)} · ${l} · ${a.cur}${a.type=='tarjeta'?` · cierra ${a.closeDay||'?'} · vence ${a.dueDay||'?'}`:''}</div></div><b class="${b<0?'neg':''}">${fm(b,a.cur)}</b></div>`}).join('')||'<p class=mu>Agregá tu primera cuenta con +.</p>')+'<p class=mu>En tarjetas y préstamos el saldo negativo es lo que debés. Para pagarlos, hacé una transferencia desde otra cuenta.</p>'}
function servs(){return `<h1>Servicios</h1>`+(vis(D.svcs).sort((a,b)=>a.day-b.day).map(s=>`<div class="c row"><div onclick="del('svcs','${s.id}')"><b>${esc(s.name)}</b> ${s.scope=='shared'?'<span class=tag>Compartido</span>':''}<div class=mu>Vence día ${s.day} · ${fm(s.amount,s.cur)}</div></div>${s.paid==ym()?'<span class=pos>✓ Pagado</span>':`<button class="btn s" onclick="payS('${s.id}')">Pagar</button>`}</div>`).join('')||'<p class=mu>Agregá ANDE, ESSAP, internet, alquiler… con +.</p>')}
function payS(id){const s=D.svcs.find(x=>x.id==id);if(!acc(s.acc))return toast('La cuenta de este servicio ya no existe');
 upsert('txs',{id:uid(),date:today(),type:'gasto',amount:s.amount,acc:s.acc,cat:'Servicios',note:s.name,scope:s.scope,by:me()});s.paid=ym();upsert('svcs',s);render();toast('Pago registrado')}
function sets(){return `<h1>Ajustes</h1><div class=c>${fld('Tu nombre',`<input value="${esc(cfg.name)}" id=cn placeholder="Ej: Ana">`)}${fld('Tipo de cambio (₲ por US$)',`<input id=cr inputmode=decimal value="${cfg.rate}">`)}</div>
 <div class=c><b>☁️ Sincronización (Firebase)</b><p class=mu>Los dos usan el mismo código de hogar y la misma configuración.</p>${fld('Código del hogar',`<div class=row><input id=cc value="${esc(cfg.code)}"><button class="btn s" onclick="$('#cc').value=uid()+uid()">Generar</button></div>`)}${fld('Configuración de Firebase (pegala tal cual)',`<textarea id=cf rows=5 placeholder="const firebaseConfig = { apiKey: ... }">${esc(cfg.fb)}</textarea>`)}${fld('Email de tu pareja (autorizado en el hogar)',`<input id=cp type=email value="${esc(cfg.partner)}">`)}<p class=mu style="margin-top:8px">Estado: ${esc(st)}</p></div>${authCard()}<button class=btn onclick="saveCfg()">Guardar y conectar</button>`}
const authCard=()=>usr?`<div class=c><b>🔐 Sesión iniciada</b><p class=mu>${esc(usr.email)}</p><button class="btn s" onclick="logout()">Cerrar sesión</button></div>`:`<div class=c><b>🔐 Iniciar sesión</b>${fld('Email','<input id=le type=email autocomplete=email>')}${fld('Contraseña (mínimo 6)','<input id=lp type=password autocomplete=current-password>')}<div class=row style="margin-top:12px"><button class="btn s" style="flex:1;padding:11px" onclick="auth(0)">Ingresar</button><button class="btn s" style="flex:1;padding:11px" onclick="auth(1)">Crear cuenta</button></div></div>`;
async function auth(n){if(!window.firebase||!firebase.apps.length)return toast('Primero guardá la configuración de Firebase');const e=$('#le').value.trim(),p=$('#lp').value;try{const a=firebase.auth();n?await a.createUserWithEmailAndPassword(e,p):await a.signInWithEmailAndPassword(e,p);initSync()}catch(x){toast(x.code=='auth/invalid-credential'?'Email o contraseña incorrectos':x.code=='auth/email-already-in-use'?'Ese email ya tiene cuenta':x.message)}}
async function logout(){await firebase.auth().signOut();unsub&&unsub();usr=ref=null;setSt('Sesión cerrada')}
function saveCfg(){cfg={name:$('#cn').value.trim(),rate:num($('#cr').value)||7500,code:$('#cc').value.trim(),fb:$('#cf').value.trim(),partner:$('#cp').value.trim().toLowerCase()};localStorage.setItem('gc',JSON.stringify(cfg));T='in';render();toast('Guardado');initSync()}
/* ---------- formularios ---------- */
const accOpts=s=>vis(D.accs).map(a=>`<option value="${a.id}" ${a.id==s?'selected':''}>${esc(a.name)} (${a.cur})</option>`).join('');
const sel=(k,o,v)=>`<select onchange="F.${k}=this.value;frm()">${o}</select>`;
const seg=(k,o)=>`<div class=seg>${o.map(([v,l])=>`<button class="${F[k]==v?'on':''}" onclick="F.${k}='${v}';frm()">${l}</button>`).join('')}</div>`;
let frm=()=>{};
function newTx(){if(!vis(D.accs).length)return toast('Primero creá una cuenta');F={type:'gasto',scope:'personal',date:today(),cat:'Comida',acc:vis(D.accs)[0].id};frm=txf;txf()}
function txf(){const a=acc(F.acc),b=acc(F.to),cross=F.type=='transferencia'&&a&&b&&a.cur!=b.cur;
 sheet(`<h3>Nuevo movimiento</h3>${seg('type',[['gasto','Gasto'],['ingreso','Ingreso'],['transferencia','Transferir']])}
 ${fld('Monto'+(a?` (${a.cur=='USD'?'US$':'₲'})`:''),`<input inputmode=decimal value="${esc(F.amount||'')}" oninput="F.amount=this.value" placeholder="0">`)}
 ${fld(F.type=='transferencia'?'Desde':'Cuenta',`<select onchange="F.acc=this.value;frm()">${accOpts(F.acc)}</select>`)}
 ${F.type=='transferencia'?fld('Hacia (también para pagar tarjeta o préstamo)',`<select onchange="F.to=this.value;frm()"><option value="">Elegir…</option>${accOpts(F.to)}</select>`)+(cross?fld(`Monto que llega (${b.cur=='USD'?'US$':'₲'})`,`<input inputmode=decimal value="${esc(F.toAmt||'')}" oninput="F.toAmt=this.value" placeholder="vacío = tipo de cambio de Ajustes">`):''):
 fld('Categoría',`<select onchange="F.cat=this.value">${Object.keys(CAT).map(c=>`<option ${c==F.cat?'selected':''}>${c}</option>`).join('')}</select>`)+fld('¿De quién es?',seg('scope',[['personal','👤 Personal'],['shared','👫 Compartido']]))}
 ${fld('Fecha',`<input type=date value="${F.date}" onchange="F.date=this.value">`)}${fld('Nota',`<input value="${esc(F.note||'')}" oninput="F.note=this.value" placeholder="Opcional">`)}<button class=btn onclick="saveTx()">Guardar</button>`)}
function saveTx(){const amt=num(F.amount),a=acc(F.acc);if(!amt)return toast('Ingresá un monto');
 const t={id:uid(),date:F.date,type:F.type,amount:amt,acc:F.acc,cat:F.cat,note:F.note||'',scope:F.scope,by:me()};
 if(F.type=='transferencia'){const b=acc(F.to);if(!b||b.id==a.id)return toast('Elegí la cuenta destino');t.to=b.id;t.cat='Transferencia';if(a.cur!=b.cur)t.toAmt=num(F.toAmt)||(a.cur=='USD'?amt*cfg.rate:amt/cfg.rate)}
 upsert('txs',t);closeS();render();toast('Guardado')}
function newAcc(){F={type:'corriente',cur:'PYG',owner:me(),name:''};frm=accf;accf()}
function accf(){const d=F.type=='tarjeta'||F.type=='prestamo';
 sheet(`<h3>Nueva cuenta</h3>${fld('Nombre',`<input value="${esc(F.name)}" oninput="F.name=this.value" placeholder="Ej: Itaú ahorro, Visa Continental">`)}
 ${fld('Tipo',`<select onchange="F.type=this.value;frm()">${Object.entries(TYP).map(([k,v])=>`<option value=${k} ${k==F.type?'selected':''}>${v[0]} ${v[1]}</option>`).join('')}</select>`)}
 ${fld('Moneda',seg('cur',[['PYG','₲ Guaraníes'],['USD','US$ Dólares']]))}${fld('Titular',seg('owner',[[me(),'👤 Mía'],['shared','👫 Compartida']]))}
 ${fld(d?'Deuda actual (lo que debés hoy)':'Saldo inicial',`<input inputmode=decimal value="${esc(F.open||'')}" oninput="F.open=this.value" placeholder="0">`)}
 ${F.type=='tarjeta'?`<div class=row>${fld('Día de cierre',`<input type=number min=1 max=31 value="${F.closeDay||''}" oninput="F.closeDay=this.value">`)}${fld('Día de vencimiento',`<input type=number min=1 max=31 value="${F.dueDay||''}" oninput="F.dueDay=this.value">`)}</div>`:''}
 <button class=btn onclick="saveAcc()">Guardar cuenta</button>`)}
function saveAcc(){if(!F.name.trim())return toast('Poné un nombre');const d=F.type=='tarjeta'||F.type=='prestamo',o=Math.abs(num(F.open));
 upsert('accs',{id:uid(),name:F.name.trim(),type:F.type,cur:F.cur,owner:F.owner,open:d?-o:o,closeDay:F.closeDay,dueDay:F.dueDay});closeS();render()}
function newSvc(){if(!vis(D.accs).length)return toast('Primero creá una cuenta');F={cur:'PYG',scope:'shared',day:10,acc:vis(D.accs)[0].id};frm=svcf;svcf()}
function svcf(){sheet(`<h3>Nuevo servicio</h3>${fld('Nombre',`<input value="${esc(F.name||'')}" oninput="F.name=this.value" placeholder="ANDE, ESSAP, internet…">`)}
 ${fld('Monto',`<input inputmode=decimal value="${esc(F.amount||'')}" oninput="F.amount=this.value">`)}${fld('Moneda',seg('cur',[['PYG','₲'],['USD','US$']]))}
 ${fld('Día de vencimiento',`<input type=number min=1 max=31 value="${F.day}" oninput="F.day=+this.value">`)}${fld('Se paga desde',`<select onchange="F.acc=this.value">${accOpts(F.acc)}</select>`)}${fld('¿De quién es?',seg('scope',[['personal','👤 Personal'],['shared','👫 Compartido']]))}
