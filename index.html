<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gastos Mefa</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Gastos Mefa">
<style>
:root{--bg:#f2f7f6;--card:#fff;--tx:#10201c;--mu:#70827d;--pr:#0d9488;--hero:#0f766e;--h2:#14b8a6;--pr2:#d9f6f1;--vi:#7c3aed;--vi2:#ede9fe;--bad:#e11d48;--ok:#059669;--bd:#e5eeec;--sh:0 4px 18px #0000001a}
@media(prefers-color-scheme:dark){:root{--bg:#0b1211;--card:#141f1d;--tx:#e9f3f0;--mu:#8da39d;--pr:#2dd4bf;--pr2:#12403b;--vi:#a78bfa;--vi2:#2e2150;--bd:#223330;--sh:0 4px 18px #0006}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:15px/1.45 -apple-system,"Segoe UI",Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-top:env(safe-area-inset-top)}
body:before{content:"";position:fixed;top:0;left:0;right:0;height:280px;background:radial-gradient(120% 100% at 50% -20%,color-mix(in srgb,var(--h2) 25%,transparent),transparent);pointer-events:none}
main{position:relative;max-width:560px;margin:auto;padding:58px 16px 150px}
h1{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-bottom:14px}h3{margin-bottom:12px;font-size:18px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.top h1{margin:0}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--h2),var(--hero));color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.c{background:var(--card);border-radius:20px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between}
.mu{color:var(--mu);font-size:13px}.big{font-size:34px;font-weight:800;letter-spacing:-1px}
.hero{background:linear-gradient(135deg,var(--hero),var(--h2) 75%);color:#fff;border-radius:26px;padding:22px;box-shadow:0 12px 30px #0004;position:relative;overflow:hidden;margin-bottom:18px}
.hero:after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:#ffffff1c}
.hero .mu{color:#ffffffcc}.hero .u{font-size:19px;font-weight:600}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.g3 .c{margin:0;padding:12px}.g3 b{font-size:14px;display:block;margin-top:3px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--pr)}.dot.v{background:var(--vi)}.dot.a{background:#f59e0b}
.st{font-weight:700;font-size:16px;margin:22px 0 10px}
nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:12px;right:12px;max-width:520px;margin:auto;background:var(--card);border-radius:26px;box-shadow:0 8px 30px #0003;display:flex;padding:6px;gap:2px;z-index:3}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:7px 0;font-size:10.5px;border-radius:20px;font-weight:600}nav button.on{background:var(--pr2);color:var(--pr)}nav span{display:block;font-size:20px}
.fab{position:fixed;right:20px;bottom:calc(96px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:20px;border:0;background:linear-gradient(135deg,var(--h2),var(--hero));color:#fff;font-size:32px;box-shadow:0 8px 22px #0004;z-index:3}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:8px}.seg button{flex:1;border:0;background:none;padding:9px;border-radius:11px;color:var(--tx);font-size:14px;font-weight:600}.seg button.on{background:var(--hero);color:#fff;box-shadow:0 3px 10px #0004}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px 14px;border:2px solid transparent;border-radius:14px;background:var(--bg);color:var(--tx);font:inherit;outline:0}input[type=color]{height:46px;padding:4px;cursor:pointer}input:focus,select:focus,textarea:focus{border-color:var(--pr)}
.amt{font-size:34px;font-weight:800;text-align:center;padding:14px}
.btn{width:100%;padding:14px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--h2),var(--hero));color:#fff;font-weight:700;margin-top:16px;font-size:16px;box-shadow:0 6px 16px #0003}.btn.s{width:auto;padding:8px 14px;margin:0;font-size:13px;border-radius:12px;box-shadow:none}
#sh{display:none;position:fixed;inset:0;z-index:5}#sh.on{display:block}.bk{position:absolute;inset:0;background:#0008}
.pn{position:absolute;bottom:0;left:0;right:0;max-width:560px;margin:auto;background:var(--card);border-radius:28px 28px 0 0;padding:18px 18px 26px;max-height:92vh;overflow:auto;animation:up .25s}@keyframes up{from{transform:translateY(50px);opacity:0}}
.pn:before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--bd);margin:-6px auto 14px}
.chips{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto}.chips button{border:0;background:var(--card);color:var(--tx);border-radius:20px;padding:8px 15px;white-space:nowrap;font-weight:600;box-shadow:var(--sh)}.chips .on{background:var(--hero);color:#fff}
.neg{color:var(--bad)}.pos{color:var(--ok)}
.ic{width:44px;height:44px;border-radius:15px;background:var(--pr2);display:grid;place-items:center;font-size:21px;flex:none}.ic.v{background:var(--vi2)}.ic.d{background:#e11d4820}
.tag{font-size:11px;padding:2px 9px;border-radius:10px;background:var(--vi2);color:var(--vi);font-weight:600}
.em{text-align:center;padding:36px 10px;font-size:42px}.em p{font-size:14px;margin-top:6px;color:var(--mu)}
#to{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:11px 18px;border-radius:22px;display:none;z-index:9;box-shadow:0 6px 20px #0005}
#cl{position:fixed;top:calc(10px + env(safe-area-inset-top));right:14px;z-index:4;width:40px;height:40px;border-radius:13px;border:0;background:var(--card);box-shadow:var(--sh);font-size:19px;opacity:.65}#cl.ok{opacity:1;box-shadow:0 0 0 2px var(--ok)}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--bd)}
button,.c[onclick]{transition:transform .15s,box-shadow .15s,filter .15s}button:active{transform:scale(.96)}
@media(hover:hover){button{cursor:pointer}.btn:hover,.fab:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 14px 28px #0005;filter:brightness(1.1)}
nav button:hover,.chips button:hover,.seg button:hover,#cl:hover{transform:translateY(-3px);box-shadow:0 8px 18px #0003;opacity:1}.sw:hover{transform:scale(1.18)}.c[onclick]:hover{transform:translateY(-2px);box-shadow:0 10px 24px #0002}}
</style></head><body>
<button id="cl" onclick="cloud()" title="Conexión con Firebase">☁️</button><main id="app"></main><button class="fab" id="fab" onclick="fab()">+</button><nav id="nav"></nav><div id="sh"></div><div id="to"></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),today=()=>new Date().toISOString().slice(0,10),ym=()=>today().slice(0,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),vis=a=>a.filter(x=>!x.del),srt=a=>[...a].sort((x,y)=>x.id<y.id?-1:1);
const rd=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
let D=rd('gd',{accs:[],txs:[],svcs:[]}),cfg=rd('gc',{user:'',fb:''});
const CAT={Comida:'🛒',Hogar:'🏠',Servicios:'💡',Transporte:'🚗',Salud:'💊',Ocio:'🎉',Compras:'🛍️',Deudas:'💳',Sueldo:'💼',Otros:'📦'};
const TYP={corriente:['🏦','Cuenta corriente'],ahorro:['🐖','Caja de ahorro'],efectivo:['💵','Efectivo'],digital:['📱','Billetera digital'],tarjeta:['💳','Tarjeta de crédito'],prestamo:['🤝','Préstamo / deuda']};
const fm=(n,c)=>(n<0?'−':'')+(c=='USD'?'US$ '+Math.abs(n).toLocaleString('es-PY',{minimumFractionDigits:2,maximumFractionDigits:2}):'₲ '+Math.round(Math.abs(n)).toLocaleString('es-PY'));
function num(s){s=String(s||'').trim().replace(/[^\d.,]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/\.\d{3}(\.|$)/.test(s))s=s.replace(/\./g,'');return parseFloat(s)||0}
function toast(m){const t=$('#to');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function sheet(h){$('#sh').innerHTML='<div class=bk onclick=closeS()></div><div class=pn>'+h+'</div>';$('#sh').classList.add('on')}
function closeS(){$('#sh').classList.remove('on')}
const fld=(l,i)=>`<label>${l}</label>${i}`;
/* ---------- datos + sync ---------- */
const ser=()=>JSON.stringify({accs:srt(D.accs),txs:srt(D.txs),svcs:srt(D.svcs)});
function merge(r){for(const k of['accs','txs','svcs']){const m=new Map(D[k].map(x=>[x.id,x]));(r[k]||[]).forEach(x=>{const l=m.get(x.id);if(!l||x.u>l.u)m.set(x.id,x)});D[k]=srt([...m.values()])}localStorage.setItem('gd',JSON.stringify(D))}
let db,ref,usr,unsub,st='Solo en este dispositivo',t0;
function setSt(s){st=s;const c=$('#cl');if(c)c.className=s[0]=='✓'?'ok':''}
function save(){localStorage.setItem('gd',JSON.stringify(D));push()}
function push(){if(!ref)return;clearTimeout(t0);t0=setTimeout(()=>db.runTransaction(async t=>{const s=await t.get(ref);if(s.exists)merge(JSON.parse(s.data().d));t.set(ref,{d:ser()})}).then(()=>setSt('✓ Sincronizado')).catch(()=>{setSt('Sin conexión: se reintenta solo');setTimeout(push,15000)}),400)}
addEventListener('online',push);
const lsc=u=>new Promise((r,j)=>{const s=document.createElement('script');s.src=u;s.onload=r;s.onerror=j;document.head.appendChild(s)});
async function boot(){if(!cfg.fb)throw Error('Primero configurá Firebase con el ícono ☁️');const B='https://www.gstatic.com/firebasejs/10.12.2/firebase-';
 if(!window.firebase){await lsc(B+'app-compat.js');await lsc(B+'auth-compat.js');await lsc(B+'firestore-compat.js')}
 if(!firebase.apps.length)firebase.initializeApp(new Function('return '+cfg.fb.slice(cfg.fb.indexOf('{'),cfg.fb.lastIndexOf('}')+1))());db=firebase.firestore()}
async function initSync(){if(!cfg.fb||!cfg.user)return;try{setSt('Conectando…');await boot();
 usr=await new Promise(r=>{const o=firebase.auth().onAuthStateChanged(x=>{o();r(x)})});if(!usr)return setSt('Sesión vencida: volvé a ingresar');
 ref=db.collection('hogares').doc('hogar');unsub&&unsub();
 unsub=ref.onSnapshot(s=>{if(s.exists){merge(JSON.parse(s.data().d));render();if(s.data().d!=ser())push();else setSt('✓ Sincronizado')}else push()},e=>setSt('Error: '+e.message))}catch(e){setSt('Sin conexión')}}
function upsert(k,o){o.u=Date.now();const i=D[k].findIndex(x=>x.id==o.id);i<0?D[k].push(o):D[k][i]=o;save()}
function del(k,id){const o=D[k].find(x=>x.id==id);if(o&&confirm('¿Eliminar?')){o.del=1;upsert(k,o);render()}}
/* ---------- cálculos ---------- */
const acc=id=>D.accs.find(a=>a.id==id),me=()=>cfg.user?cfg.user[0].toUpperCase()+cfg.user.slice(1):'Yo';
function bal(a){let b=a.open||0;vis(D.txs).forEach(t=>{if(t.acc==a.id)b+=t.type=='ingreso'?t.amount:-t.amount;if(t.to==a.id)b+=t.toAmt||t.amount});return b}
const spend=(f,c)=>vis(D.txs).filter(t=>t.type=='gasto'&&t.date.startsWith(ym())&&acc(t.acc)?.cur==c&&f(t)).reduce((s,t)=>s+t.amount,0);
/* ---------- vistas ---------- */
let T='in',flt='all',F={};
const TABS=[['in','🏠','Inicio'],['mv','🧾','Movs'],['cu','👛','Cuentas'],['sv','💡','Servicios'],['aj','⚙️','Opciones']];
function render(){const lg=!cfg.user;$('#nav').style.display=lg?'none':'flex';
 if(lg){$('#fab').style.display='none';$('#app').innerHTML=loginView();return}
 $('#app').innerHTML={in:home,mv:movs,cu:cuentas,sv:servs,aj:sets}[T]();
 $('#nav').innerHTML=TABS.map(([k,i,l])=>`<button class="${T==k?'on':''}" onclick="T='${k}';render()"><span>${i}</span>${l}</button>`).join('');$('#fab').style.display=T=='aj'?'none':'block'}
function fab(){({in:newTx,mv:newTx,cu:newAcc,sv:newSvc})[T]()}
const emp=(i,t)=>`<div class=em>${i}<p>${t}</p></div>`;
function home(){const A=vis(D.accs),net=c=>A.filter(a=>a.cur==c).reduce((s,a)=>s+bal(a),0),h=new Date().getHours(),
 two=f=>{const u=spend(f,'USD');return fm(spend(f,'PYG'),'PYG')+(u?`<div class=mu>${fm(u,'USD')}</div>`:'')};
 const pend=vis(D.svcs).filter(s=>s.paid!=ym()).sort((a,b)=>a.day-b.day),dd=new Date().getDate();
 return `<div class=top><div><div class=mu>${h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches'}</div><h1>${esc(me())} 👋</h1></div><div class=av>${esc(me()[0]||'?').toUpperCase()}</div></div>
 <div class=hero><div class=mu>Tu dinero</div><div class=big>${fm(net('PYG'),'PYG')}</div><div class=u>${fm(net('USD'),'USD')}</div></div>
 <div class=st style="margin-top:0">Gastos del mes</div><div class=g3><div class=c><div class=mu><i class="dot v"></i>Compartidos</div><b>${two(t=>t.scope=='shared')}</b></div><div class=c><div class=mu><i class=dot></i>Míos</div><b>${two(t=>t.scope=='personal'&&t.by==me())}</b></div><div class=c><div class=mu><i class="dot a"></i>Pareja</div><b>${two(t=>t.scope=='personal'&&t.by!=me())}</b></div></div>
 <div class=st>Servicios por pagar</div>`+(pend.map(s=>`<div class="c row"><div class="ic ${s.scope=='shared'?'v':''}">💡</div><div style="flex:1"><b>${esc(s.name)}</b><div class=mu>Día ${s.day} ${s.day<dd?'<span class=neg>· vencido</span>':''}</div></div><div style="text-align:right"><b>${fm(s.amount,s.cur)}</b><br><button class="btn s" style="margin-top:4px" onclick="payS('${s.id}')">Pagar</button></div></div>`).join('')||emp('🎉','Todo al día'))}
function txRow(t){const a=acc(t.acc),tr=t.type=='transferencia',sg=t.type=='ingreso'?'+':tr?'⇄ ':'−';
 return `<div class="c row" onclick="del('txs','${t.id}')"><div class="ic ${t.scope=='shared'&&!tr?'v':''}">${tr?'⇄':CAT[t.cat]||'📦'}</div><div style="flex:1;min-width:0"><b>${esc(t.note||t.cat)}</b><div class=mu>${t.date.slice(8)}/${t.date.slice(5,7)} · ${esc(a?.name)}${tr?' → '+esc(acc(t.to)?.name):''} · ${esc(t.by)} ${t.scope=='shared'&&!tr?'<span class=tag>Compartido</span>':''}</div></div><b class="${t.type=='ingreso'?'pos':''}">${sg}${fm(t.amount,a?.cur).replace('−','')}</b></div>`}
function movs(){let L=vis(D.txs).sort((a,b)=>b.date.localeCompare(a.date)||b.u-a.u).filter(t=>flt=='all'||(flt=='shared'&&t.scope=='shared')||(flt=='mine'&&t.scope=='personal'&&t.by==me())||(flt=='part'&&t.scope=='personal'&&t.by!=me()));
 return `<h1>Movimientos</h1><div class=chips>${[['all','Todos'],['shared','Compartidos'],['mine','Míos'],['part','Pareja']].map(([k,l])=>`<button class="${flt==k?'on':''}" onclick="flt='${k}';render()">${l}</button>`).join('')}</div>`+(L.map(txRow).join('')||emp('🧾','Todavía no hay movimientos<br>Tocá + para agregar'))+(L.length?'<p class=mu style="text-align:center">Tocá un movimiento para eliminarlo</p>':'')}
function cuentas(){return `<h1>Cuentas</h1>`+(vis(D.accs).map(a=>{const b=bal(a),[i,l]=TYP[a.type],d=a.type=='tarjeta'||a.type=='prestamo';return `<div class="c row" onclick="del('accs','${a.id}')"><div class="ic ${d?'d':a.owner=='shared'?'v':''}">${i}</div><div style="flex:1;min-width:0"><b>${esc(a.name)}</b><div class=mu>${a.owner=='shared'?'👫 Compartida':'👤 '+esc(a.owner)} · ${l} · ${a.cur}${a.type=='tarjeta'?`<br>Cierra día ${a.closeDay||'?'} · vence día ${a.dueDay||'?'}`:''}</div></div><b class="${b<0?'neg':''}">${fm(b,a.cur)}</b></div>`}).join('')||emp('👛','Agregá tu primera cuenta con +'))+'<p class=mu style="text-align:center">En tarjetas y préstamos, el saldo negativo es lo que debés.<br>Pagalos con una transferencia desde otra cuenta.</p>'}
function servs(){return `<h1>Servicios</h1>`+(vis(D.svcs).sort((a,b)=>a.day-b.day).map(s=>`<div class="c row"><div class="ic ${s.scope=='shared'?'v':''}" onclick="del('svcs','${s.id}')">💡</div><div style="flex:1"><b>${esc(s.name)}</b> ${s.scope=='shared'?'<span class=tag>Compartido</span>':''}<div class=mu>Vence día ${s.day} · ${fm(s.amount,s.cur)}</div></div>${s.paid==ym()?'<b class=pos>✓ Pagado</b>':`<button class="btn s" onclick="payS('${s.id}')">Pagar</button>`}</div>`).join('')||emp('💡','Agregá ANDE, ESSAP, internet…<br>con el botón +'))}
function payS(id){const s=D.svcs.find(x=>x.id==id);if(!acc(s.acc))return toast('La cuenta de este servicio ya no existe');
 upsert('txs',{id:uid(),date:today(),type:'gasto',amount:s.amount,acc:s.acc,cat:'Servicios',note:s.name,scope:s.scope,by:me()});s.paid=ym();upsert('svcs',s);render();toast('Pago registrado')}
function sets(){return `<h1>Opciones</h1><div class=c><div class=row><div><b>👤 ${esc(me())}</b><div class=mu>Sesión iniciada</div></div><button class="btn s" onclick="logout()">Cerrar sesión</button></div></div>
 <div class=c><b>🎨 Apariencia</b>${fld('Color de botones y acentos',`<div class=row style="justify-content:flex-start;flex-wrap:wrap;gap:10px">${['#0f766e','#2563eb','#7c3aed','#db2777','#ea580c','#475569'].map(c=>`<button class=sw onclick="setTh('btn','${c}');render()" style="background:${c}"></button>`).join('')}</div><input type=color value="${cfg.theme?.btn||'#0f766e'}" oninput="setTh('btn',this.value)" style="margin-top:10px">`)}${fld('Color de fondo',`<input type=color value="${cfg.theme?.bg||'#f2f7f6'}" oninput="setTh('bg',this.value)">`)}<button class="btn s" style="margin-top:14px" onclick="resetTh()">Restablecer colores</button></div>`}
const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),mix=(a,b,t)=>'#'+hx(a).map((v,i)=>Math.round(v*(1-t)+hx(b)[i]*t).toString(16).padStart(2,'0')).join(''),lum=h=>{const[r,g,b]=hx(h);return(.299*r+.587*g+.114*b)/255};
function applyTheme(){const r=document.documentElement.style,t=cfg.user?cfg.theme||{}:{},sd=matchMedia('(prefers-color-scheme:dark)').matches;
 ['--hero','--h2','--pr','--pr2','--bg','--card','--tx','--mu','--bd'].forEach(k=>r.removeProperty(k));
 const dk=t.bg?lum(t.bg)<.5:sd;
 if(t.bg){r.setProperty('--bg',t.bg);r.setProperty('--card',dk?mix(t.bg,'#ffffff',.08):mix(t.bg,'#ffffff',.65));r.setProperty('--tx',dk?'#e9f3f0':'#10201c');r.setProperty('--mu',dk?'#9db0aa':'#70827d');r.setProperty('--bd',mix(t.bg,dk?'#ffffff':'#000000',.1))}
 if(t.btn){r.setProperty('--hero',t.btn);r.setProperty('--h2',mix(t.btn,'#ffffff',.3));r.setProperty('--pr',dk?mix(t.btn,'#ffffff',.45):t.btn);r.setProperty('--pr2',mix(t.btn,t.bg?mix(t.bg,dk?'#ffffff':'#ffffff',dk?.08:.65):dk?'#141f1d':'#ffffff',dk?.75:.85))}
 document.querySelector('meta[name=theme-color]').content=t.btn||'#0f766e'}
function setTh(k,v){cfg.theme={...cfg.theme,[k]:v};localStorage.setItem('gc',JSON.stringify(cfg));applyTheme()}
function resetTh(){cfg.theme={};localStorage.setItem('gc',JSON.stringify(cfg));applyTheme();render()}
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme);
const loginView=()=>`<div style="padding-top:6vh;text-align:center"><img src="icon.svg" alt="" style="width:92px;height:92px;display:block;margin:0 auto 16px;border-radius:28px;box-shadow:0 12px 28px #0005"><h1 style="margin-bottom:4px">Gastos Mefa</h1><p class=mu>Ingresá con tu usuario</p></div><div class=c style="margin-top:22px">${fld('Usuario','<input id=lu autocapitalize=none autocomplete=username>')}${fld('Contraseña',`<input id=lp type=password autocomplete=current-password onkeydown="if(event.key=='Enter')login()">`)}<button class=btn onclick="login()">Ingresar</button></div>${cfg.fb?'':'<p class=mu style="text-align:center">Primero tocá ☁️ (arriba a la derecha) y pegá la configuración de Firebase.</p>'}`;
async function login(){const u=$('#lu').value.trim().toLowerCase().replace(/\s+/g,''),p=$('#lp').value;if(!u||!p)return toast('Completá usuario y contraseña');
 try{await boot();await firebase.auth().signInWithEmailAndPassword(u.includes('@')?u:u+'@gastos.app',p);cfg.user=u.split('@')[0];localStorage.setItem('gc',JSON.stringify(cfg));T='in';applyTheme();render();initSync()}
 catch(x){toast(['auth/invalid-credential','auth/user-not-found','auth/wrong-password'].includes(x.code)?'Usuario o contraseña incorrectos':x.message)}}
async function logout(){if(!confirm('¿Cerrar sesión?'))return;try{await firebase.auth().signOut()}catch(e){}unsub&&unsub();usr=ref=null;cfg.user='';localStorage.setItem('gc',JSON.stringify(cfg));applyTheme();render()}
function cloud(){sheet(`<h3>☁️ Conexión con Firebase</h3><p class=mu>Pegá la configuración de tu proyecto (la misma en todos los dispositivos).</p>${fld('Configuración',`<textarea id=cf rows=7 placeholder="const firebaseConfig = {...}">${esc(cfg.fb)}</textarea>`)}<p class=mu style="margin-top:8px">Estado: ${esc(st)}</p><button class=btn onclick="saveFb()">Guardar y conectar</button>`)}
function saveFb(){cfg.fb=$('#cf').value.trim();localStorage.setItem('gc',JSON.stringify(cfg));toast('Guardado');setTimeout(()=>location.reload(),500)}
/* ---------- formularios ---------- */
const accOpts=s=>vis(D.accs).map(a=>`<option value="${a.id}" ${a.id==s?'selected':''}>${esc(a.name)} (${a.cur})</option>`).join('');
const sel=(k,o,v)=>`<select onchange="F.${k}=this.value;frm()">${o}</select>`;
const seg=(k,o)=>`<div class=seg>${o.map(([v,l])=>`<button class="${F[k]==v?'on':''}" onclick="F.${k}='${v}';frm()">${l}</button>`).join('')}</div>`;
let frm=()=>{};
function newTx(){if(!vis(D.accs).length)return toast('Primero creá una cuenta');F={type:'gasto',scope:'personal',date:today(),cat:'Comida',acc:vis(D.accs)[0].id};frm=txf;txf()}
function txf(){const a=acc(F.acc),b=acc(F.to),cross=F.type=='transferencia'&&a&&b&&a.cur!=b.cur;
 sheet(`<h3>Nuevo movimiento</h3>${seg('type',[['gasto','Gasto'],['ingreso','Ingreso'],['transferencia','Transferir']])}
 ${fld('Monto'+(a?` (${a.cur=='USD'?'US$':'₲'})`:''),`<input class=amt inputmode=decimal value="${esc(F.amount||'')}" oninput="F.amount=this.value" placeholder="0">`)}
 ${fld(F.type=='transferencia'?'Desde':'Cuenta',`<select onchange="F.acc=this.value;frm()">${accOpts(F.acc)}</select>`)}
 ${F.type=='transferencia'?fld('Hacia (también para pagar tarjeta o préstamo)',`<select onchange="F.to=this.value;frm()"><option value="">Elegir…</option>${accOpts(F.to)}</select>`)+(cross?fld(`Monto que llega (${b.cur=='USD'?'US$':'₲'})`,`<input inputmode=decimal value="${esc(F.toAmt||'')}" oninput="F.toAmt=this.value" placeholder="¿Cuánto llega?">`):''):
 fld('Categoría',`<select onchange="F.cat=this.value">${Object.keys(CAT).map(c=>`<option ${c==F.cat?'selected':''}>${c}</option>`).join('')}</select>`)+fld('¿De quién es?',seg('scope',[['personal','👤 Personal'],['shared','👫 Compartido']]))}
 ${fld('Fecha',`<input type=date value="${F.date}" onchange="F.date=this.value">`)}${fld('Nota',`<input value="${esc(F.note||'')}" oninput="F.note=this.value" placeholder="Opcional">`)}<button class=btn onclick="saveTx()">Guardar</button>`)}
function saveTx(){const amt=num(F.amount),a=acc(F.acc);if(!amt)return toast('Ingresá un monto');
 const t={id:uid(),date:F.date,type:F.type,amount:amt,acc:F.acc,cat:F.cat,note:F.note||'',scope:F.scope,by:me()};
 if(F.type=='transferencia'){const b=acc(F.to);if(!b||b.id==a.id)return toast('Elegí la cuenta destino');t.to=b.id;t.cat='Transferencia';if(a.cur!=b.cur){t.toAmt=num(F.toAmt);if(!t.toAmt)return toast('Ingresá cuánto llega a la otra cuenta')}}
 upsert('txs',t);closeS();render();toast('Guardado')}
function newAcc(){F={type:'corriente',cur:'PYG',owner:me(),name:''};frm=accf;accf()}
function accf(){const d=F.type=='tarjeta'||F.type=='prestamo';
 sheet(`<h3>Nueva cuenta</h3>${fld('Nombre',`<input value="${esc(F.name)}" oninput="F.name=this.value" placeholder="Ej: Itaú ahorro, Visa Continental">`)}
 ${fld('Tipo',`<select onchange="F.type=this.value;frm()">${Object.entries(TYP).map(([k,v])=>`<option value=${k} ${k==F.type?'selected':''}>${v[0]} ${v[1]}</option>`).join('')}</select>`)}
 ${fld('Moneda',seg('cur',[['PYG','₲ Guaraníes'],['USD','US$ Dólares']]))}${fld('Titular',seg('owner',[[me(),'👤 Mía'],['shared','👫 Compartida']]))}
 ${fld(d?'Deuda actual (lo que debés hoy)':'Saldo inicial',`<input inputmode=decimal value="${esc(F.open||'')}" oninput="F.open=this.value" placeholder="0">`)}
 ${F.type=='tarjeta'?`<div class=row>${fld('Día de cierre',`<input type=number min=1 max=31 value="${F.closeDay||''}" oninput="F.closeDay=this.value">`)}${fld('Día de vencimiento',`<input type=number min=1 max=31 value="${F.dueDay||''}" oninput="F.dueDay=this.value">`)}</div>`:''}
 <button class=btn onclick="saveAcc()">Guardar cuenta</button>`)}
function saveAcc(){if(!F.name.trim())return toast('Poné un nombre');const d=F.type=='tarjeta'||F.type=='prestamo',o=Math.abs(num(F.open));
 upsert('accs',{id:uid(),name:F.name.trim(),type:F.type,cur:F.cur,owner:F.owner,open:d?-o:o,closeDay:F.closeDay,dueDay:F.dueDay});closeS();render()}
function newSvc(){if(!vis(D.accs).length)return toast('Primero creá una cuenta');F={cur:'PYG',scope:'shared',day:10,acc:vis(D.accs)[0].id};frm=svcf;svcf()}
function svcf(){sheet(`<h3>Nuevo servicio</h3>${fld('Nombre',`<input value="${esc(F.name||'')}" oninput="F.name=this.value" placeholder="ANDE, ESSAP, internet…">`)}
 ${fld('Monto',`<input inputmode=decimal value="${esc(F.amount||'')}" oninput="F.amount=this.value">`)}${fld('Moneda',seg('cur',[['PYG','₲'],['USD','US$']]))}
 ${fld('Día de vencimiento',`<input type=number min=1 max=31 value="${F.day}" oninput="F.day=+this.value">`)}${fld('Se paga desde',`<select onchange="F.acc=this.value">${accOpts(F.acc)}</select>`)}${fld('¿De quién es?',seg('scope',[['personal','👤 Personal'],['shared','👫 Compartido']]))}
 <button class=btn onclick="saveSvc()">Guardar</button>`)}
function saveSvc(){if(!F.name||!num(F.amount))return toast('Completá nombre y monto');upsert('svcs',{id:uid(),name:F.name,amount:num(F.amount),cur:F.cur,day:F.day||1,acc:F.acc,scope:F.scope});closeS();render()}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
applyTheme();render();initSync();
</script></body></html>
