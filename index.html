<script>
const $=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),today=()=>new Date().toISOString().slice(0,10),ym=()=>today().slice(0,7);

const CAT={Comida:'🛒',Hogar:'🏠',Servicios:'💡',Transporte:'🚗',Salud:'💊',Ocio:'🎉',Compras:'🛍️',Deudas:'💳',Sueldo:'💼',Otros:'📦'};
const TYP={corriente:['🏦','Cuenta corriente'],ahorro:['🐖','Caja de ahorro'],efectivo:['💵','Efectivo'],digital:['📱','Billetera digital'],tarjeta:['💳','Tarjeta de crédito'],prestamo:['🤝','Préstamo'],cuotas:['🛒','Objeto a cuotas'],seguro:['🩺','Seguro médico'],inversion:['📈','Fondo de inversión'],otra:['📌','Otra deuda']};

function num(s){s=String(s||'').trim().replace(/[^\d.,]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/\.\d{3}(\.|$)/.test(s))s=s.replace(/\./g,'');return parseFloat(s)||0}

const fld=(l,i)=>`<label>${l}</label>${i}`;
/* ---------- datos + sync ---------- */
const ser=()=>JSON.stringify({accs:srt(D.accs),txs:srt(D.txs),svcs:srt(D.svcs),mem:srt(D.mem)});
function merge(r){for(const k of['accs','txs','svcs','mem']){const m=new Map(D[k].map(x=>[x.id,x]));(r[k]||[]).forEach(x=>{const l=m.get(x.id);if(!l||x.u>l.u)m.set(x.id,x)});D[k]=srt([...m.values()])}localStorage.setItem('gd',JSON.stringify(D))}
let db,ref,usr,unsub,st='Solo en este dispositivo',t0;

function push(){if(!ref)return;clearTimeout(t0);t0=setTimeout(()=>db.runTransaction(async t=>{const s=await t.get(ref);if(s.exists)merge(JSON.parse(s.data().d));t.set(ref,{d:ser()})}).then(()=>setSt('✓ Sincronizado')).catch(e=>{const m=em(e);if(st!=m)toast('Sincronización: '+m.replace('Error: ',''));setSt(m);setTimeout(push,20000)}),400)}
addEventListener('online',push);
const lsc=u=>new Promise((r,j)=>{const s=document.createElement('script');s.src=u;s.onload=r;s.onerror=j;document.head.appendChild(s)});
const VER='v16',pidIn=t=>{const m=t.match(/projectId["']?\s*:\s*["']([^"']+)/)||t.match(/authDomain["']?\s*:\s*["']([^."']+)\./);return m?m[1]:''},pidOf=()=>pidIn(cfg.fb||'');
function showPid(v){const e=$('#pid');if(e)e.value=pidIn(v)}
async function refreshApp(){try{for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();for(const k of await caches.keys())await caches.delete(k)}catch(e){}location.reload()}
function parseFb(t){const o={},K=['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId','measurementId'];
 for(const m of t.matchAll(/["']?(\w+)["']?\s*:\s*["']([^"']*)["']/g))if(K.includes(m[1]))o[m[1]]=m[2];
 if(!o.apiKey||!o.projectId)throw Error('La configuración está incompleta: faltan apiKey o projectId');return o}
async function boot(){if(!cfg.fb)throw Error('Primero configurá Firebase con el ícono ☁️');const B='https://www.gstatic.com/firebasejs/10.12.2/firebase-';
 if(!window.firebase){await lsc(B+'app-compat.js');await lsc(B+'auth-compat.js');await lsc(B+'firestore-compat.js')}
 if(!firebase.apps.length)firebase.initializeApp(parseFb(cfg.fb));db=firebase.firestore()}
async function initSync(){if(!cfg.fb||!on())return;try{setSt('Conectando…');await boot();
 usr=await new Promise(r=>{const o=firebase.auth().onAuthStateChanged(x=>{o();r(x)})});if(!usr)return setSt('Sesión vencida: volvé a ingresar');cfg.user=NM[(usr.email||'').toLowerCase()]||cfg.user;localStorage.setItem('gc',JSON.stringify(cfg));
 ref=db.collection('hogares').doc('hogar');unsub&&unsub();
 unsub=ref.onSnapshot(s=>{if(s.exists){merge(JSON.parse(s.data().d));normNames();render();if(s.data().d!=ser())push();else setSt('✓ Sincronizado')}else push()},e=>{setSt(em(e));toast('Sincronización: '+(e.code||e.message))})}catch(e){setSt(em(e))}}
function upsert(k,o){o.u=Date.now();const i=D[k].findIndex(x=>x.id==o.id);i<0?D[k].push(o):D[k][i]=o;save()}
function del(k,id){const o=D[k].find(x=>x.id==id);if(o&&confirm('¿Eliminar?')){o.del=1;upsert(k,o);if(k=='txs'){D.txs.filter(x=>x.rof==id&&x.pend).forEach(x=>{x.del=1;upsert('txs',x)});D.accs.forEach(a=>{const q=a.cuotero&&a.cuotero.find(x=>x.tx==id);if(q){q.paid=0;q.tx=undefined;upsert('accs',a)}})}render()}}
/* ---------- cálculos ---------- */
const acc=id=>D.accs.find(a=>a.id==id),me=()=>cfg.user?cfg.user[0].toUpperCase()+cfg.user.slice(1):'Yo';
function bal(a){let b=a.open||0;vis(D.txs).forEach(t=>{if(t.pend||t.hist)return;if(t.acc==a.id)b+=t.type=='ingreso'?t.amount:-t.amount;if(t.to==a.id)b+=t.toAmt||t.amount});return b}
const spend=(f,c)=>vis(D.txs).filter(t=>t.type=='gasto'&&t.date.startsWith(ym())&&acc(t.acc)?.cur==c&&f(t)).reduce((s,t)=>s+share(t),0);
/* ---------- vistas ---------- */
let T='in',flt='all',F={},AD,TP,PRE;
const TABS=[['in','🏠','Inicio'],['mv','🧾','Movs'],['cu','👛','Cuentas'],['de','💳','Deudas'],['sv','💡','Servicios'],['aj','⚙️','Opciones']];
function render(){const lg=!on();$('#nav').style.display=lg?'none':'flex';$('#cl').style.display=lg?'block':'none';$('#app').style.paddingTop=lg?'':'22px';
 if(lg){$('#fab').style.display='none';$('#app').innerHTML=loginView();return}
 $('#app').innerHTML={in:home,mv:movs,cu:cuentas,de:deudas,sv:servs,aj:sets,ad:accDetail}[T]();
 $('#nav').innerHTML=TABS.map(([k,i,l])=>`<button class="${(T=='ad'?TP:T)==k?'on':''}" onclick="T='${k}';render()"><span>${i}</span>${l}</button>`).join('');$('#fab').style.display=T=='aj'?'none':'block'}
function fab(){({in:newTx,mv:newTx,cu:()=>newAcc('cta'),de:()=>newAcc('deu'),sv:newSvc,ad:()=>newTx(acc(AD)&&(!deb(acc(AD))||acc(AD).type=='tarjeta')?AD:undefined)})[T]()}
const on=()=>sessionStorage.getItem('ses')=='1'&&cfg.user,MS=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'],MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'],mlab=m=>MES[+m.slice(5)-1]+' '+m.slice(0,4);
const NM={'gyanmelgarejo@gmail.com':'Gyan','fiorelladomin@gmail.com':'Fio'},UE={gyan:'gyanmelgarejo@gmail.com',fio:'fiorelladomin@gmail.com'},part=()=>({Gyan:'Fio',Fio:'Gyan'})[me()]||(D.mem.find(x=>x.id!=me())||{}).id||'Tu pareja',vacc=()=>vis(D.accs).filter(a=>a.owner=='shared'||who(a.owner)==me()),vsv=()=>vis(D.svcs).filter(s=>s.scope=='shared'||!s.by||who(s.by)==me()),svcDue=s=>s.monthly===0?(!s.paid&&(s.ym||ym())<=ym()):s.paid!=ym(),svcPaid=s=>s.monthly===0?!!s.paid:s.paid==ym(),deb=a=>['tarjeta','prestamo','cuotas','seguro','inversion','otra'].includes(a.type),tab=a=>['prestamo','cuotas','seguro','inversion','otra'].includes(a.type),isNeg=t=>['tarjeta','prestamo','cuotas','seguro','otra'].includes(t);
const sum=(L,ty,c,f=t=>t.amount)=>L.filter(t=>t.type==ty&&!t.pend&&(acc(t.acc)?.cur||t.cur)==c).reduce((s,t)=>s+f(t),0);
const emp=(i,t)=>`<div class=em>${i}<p>${t}</p></div>`;
function ensureMem(){if(!D.mem.some(x=>x.id==me()))upsert('mem',{id:me()})}
function owes(){const m=me(),r={PYG:0,USD:0};vis(D.txs).forEach(t=>{if(t.hist)return;if(t.type=='gasto'&&t.scope=='shared'&&t.pays&&t.pays!='me'){const c=acc(t.acc)?.cur||'PYG',x=t.pays=='half'?base(t)/2:base(t);r[c]+=t.by==m?x:-x}if(t.type=='saldo')r[t.cur]+=t.by==m?t.amount:-t.amount});return r}
const recv=t=>{if(t.type!='transferencia'||t.cat!='Devolución')return false;const o=(acc(t.to)||{}).owner;return o=='shared'||who(o)==me()};
const base=t=>t.amount-(t.rei&&acc(t.acc)?rv(t,acc(t.acc)):0);
const share=t=>{const mine=who(t.by)==me(),p=t.pays;if(!p)return t.amount;if(p=='half')return base(t)/2;if(p=='me')return mine?t.amount:0;return mine?0:base(t)};
const who=n=>/^gyan/i.test(n||'')?'Gyan':/^fio/i.test(n||'')?'Fio':n;
function normNames(){let ch=0;for(const k of['accs','txs','svcs'])D[k].forEach(o=>{const f=k=='accs'?'owner':'by';if(o[f]&&who(o[f])!==o[f]){o[f]=who(o[f]);o.u=Date.now();ch=1}});if(ch)save()}
const nf=n=>{const[i,d]=String(n).split('.');return i.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+(d?','+d:'')};
function fmtIn(el){const[i0,d]=el.value.replace(/[^\d,]/g,'').split(',');const i=i0.replace(/^0+(?=\d)/,'').replace(/\B(?=(\d{3})+(?!\d))/g,'.');el.value=d!==undefined?i+','+d.slice(0,2):i;return el.value}
const grp=(L,f)=>{const g={};L.forEach(x=>{const n=f(x),k=n.toLowerCase();(g[k]=g[k]||{n,L:[]}).L.push(x)});return Object.values(g).sort((a,b)=>a.n.localeCompare(b.n))},bank=a=>a.type=='efectivo'?'Efectivo':a.name.trim().split(/\s+/)[0]||'Otros',optsOf=(L,v)=>optsG(L,v);
const optsG=(L,v)=>grp(L,bank).map(g=>`<optgroup label="${esc(g.n)}">`+g.L.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(a=>`<option value="${a.id}" ${a.id==v?'selected':''}>${esc(a.name)} (${a.cur})</option>`).join('')+'</optgroup>').join('');
const cu$=c=>c=='USD'?'US$':'₲',recA=(c,ex)=>vis(D.accs).filter(x=>x.cur==c&&!deb(x)&&x.id!=ex&&(who(x.owner)==part()||x.owner=='shared'));

 ${fld('Monto',`<input inputmode=decimal value="${esc(F.amount||'')}" oninput="F.amount=fmtIn(this);reCalc()">`)}${fld('Moneda',seg('cur',[['PYG','₲'],['USD','US$']]))}
 ${fld('Programación',seg('monthly',[[1,'🔁 Programar mensualmente'],[0,'Pago único']]))}${F.monthly==0?fld('Mes del pago',`<input type=month value="${F.ym||ym()}" onchange="F.ym=this.value">`):''}${fld('Día de vencimiento',`<input type=number min=1 max=31 value="${F.day}" oninput="F.day=+this.value">`)}${fld('Se paga desde',`<select onchange="F.acc=this.value">${accOpts(F.acc)}</select>`)}${fld('¿De quién es?',seg('scope',[['personal','👤 Personal'],['shared','👫 Compartido']]))}
 <button class=btn onclick="saveSvc()">Guardar</button>`)}
function saveSvc(){if(!F.name||!num(F.amount))return toast('Completá nombre y monto');const old=D.svcs.find(x=>x.id==F.id)||{};upsert('svcs',{...old,id:F.id||uid(),name:F.name,amount:num(F.amount),cur:F.cur,day:F.day||1,acc:F.acc,scope:F.scope,monthly:F.monthly==0?0:1,ym:F.ym||ym(),by:old.by||me()});closeS();render()}
['gesturestart','gesturechange','gestureend'].forEach(v=>document.addEventListener(v,e=>e.preventDefault()));
document.addEventListener('touchmove',e=>{if(e.touches.length>1||(e.scale&&e.scale!==1))e.preventDefault()},{passive:false});
document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['+','-','=','0'].includes(e.key))e.preventDefault()});
document.addEventListener('pointerdown',e=>{const t=e.target.closest('button,.c[onclick],.av,.hero');if(!t||t.disabled)return;const r=t.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,x=document.createElement('span');x.className='rp';x.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;t.appendChild(x);setTimeout(()=>x.remove(),650)},{passive:true});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(on()){normNames();ensureMem()}applyTheme();render();initSync();
</script></body></html>
