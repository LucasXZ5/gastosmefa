<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gastos Mefa</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Gastos Mefa">
<style>
:root{--bg:#f2f7f6;--card:#fff;--tx:#10201c;--mu:#70827d;--pr:#0d9488;--hero:#0f766e;--h2:#14b8a6;--pr2:#d9f6f1;--vi:#7c3aed;--vi2:#ede9fe;--bad:#e11d48;--ok:#059669;--bd:#e5eeec;--sh:0 4px 18px #0000001a}
@media(prefers-color-scheme:dark){:root{--bg:#0b1211;--card:#141f1d;--tx:#e9f3f0;--mu:#8da39d;--pr:#2dd4bf;--pr2:#12403b;--vi:#a78bfa;--vi2:#2e2150;--bd:#223330;--sh:0 4px 18px #0006}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:15px/1.45 -apple-system,"Segoe UI",Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-top:env(safe-area-inset-top)}
body:before{content:"";position:fixed;top:0;left:0;right:0;height:280px;background:radial-gradient(120% 100% at 50% -20%,color-mix(in srgb,var(--h2) 25%,transparent),transparent);pointer-events:none}
main{position:relative;max-width:560px;margin:auto;padding:58px 16px 150px}
h1{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-bottom:14px}h3{margin-bottom:12px;font-size:18px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.top h1{margin:0}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--h2),var(--hero));color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.c{background:var(--card);border-radius:20px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between}
.mu{color:var(--mu);font-size:13px}.big{font-size:34px;font-weight:800;letter-spacing:-1px}
.hero{background:linear-gradient(135deg,var(--hero),var(--h2) 75%);color:#fff;border-radius:26px;padding:22px;box-shadow:0 12px 30px #0004;position:relative;overflow:hidden;margin-bottom:18px}
.hero:after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:#ffffff1c}
.hero .mu{color:#ffffffcc}.hero .u{font-size:19px;font-weight:600}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.g3 .c{margin:0;padding:12px}.g3 b{font-size:14px;display:block;margin-top:3px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--pr)}.dot.v{background:var(--vi)}.dot.a{background:#f59e0b}
.st{font-weight:700;font-size:16px;margin:22px 0 10px}
nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:12px;right:12px;max-width:520px;margin:auto;background:var(--card);border-radius:26px;box-shadow:0 8px 30px #0003;display:flex;padding:6px;gap:2px;z-index:3}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:7px 0;font-size:10.5px;border-radius:20px;font-weight:600}nav button.on{background:var(--pr2);color:var(--pr)}nav span{display:block;font-size:20px}
.fab{position:fixed;right:20px;bottom:calc(96px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:20px;border:0;background:linear-gradient(135deg,var(--h2),var(--hero));color:#fff;font-size:32px;box-shadow:0 8px 22px #0004;z-index:3}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:8px}.seg button{flex:1;border:0;background:none;padding:9px;border-radius:11px;color:var(--tx);font-size:14px;font-weight:600}.seg button.on{background:var(--hero);color:#fff;box-shadow:0 3px 10px #0004}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px 14px;border:2px solid transparent;border-radius:14px;background:var(--bg);color:var(--tx);font:inherit;outline:0}input[type=color]{height:46px;padding:4px;cursor:pointer}input:focus,select:focus,textarea:focus{border-color:var(--pr)}
.amt{font-size:34px;font-weight:800;text-align:center;padding:14px}
.btn{width:100%;padding:14px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--h2),var(--hero));color:#fff;font-weight:700;margin-top:16px;font-size:16px;box-shadow:0 6px 16px #0003}.btn.s{width:auto;padding:8px 14px;margin:0;font-size:13px;border-radius:12px;box-shadow:none}
#sh{display:none;position:fixed;inset:0;z-index:5}#sh.on{display:block}.bk{position:absolute;inset:0;background:#0008}
.pn{position:absolute;bottom:0;left:0;right:0;max-width:560px;margin:auto;background:var(--card);border-radius:28px 28px 0 0;padding:18px 18px 26px;max-height:92vh;overflow:auto;animation:up .25s}@keyframes up{from{transform:translateY(50px);opacity:0}}
.pn:before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--bd);margin:-6px auto 14px}
.chips{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto}.chips button{border:0;background:var(--card);color:var(--tx);border-radius:20px;padding:8px 15px;white-space:nowrap;font-weight:600;box-shadow:var(--sh)}.chips .on{background:var(--hero);color:#fff}
.neg{color:var(--bad)}.pos{color:var(--ok)}
.ic{width:44px;height:44px;border-radius:15px;background:var(--pr2);display:grid;place-items:center;font-size:21px;flex:none}.ic.v{background:var(--vi2)}.ic.d{background:#e11d4820}
.tag{font-size:11px;padding:2px 9px;border-radius:10px;background:var(--vi2);color:var(--vi);font-weight:600}
.em{text-align:center;padding:36px 10px;font-size:42px}.em p{font-size:14px;margin-top:6px;color:var(--mu)}
#to{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:11px 18px;border-radius:22px;display:none;z-index:9;box-shadow:0 6px 20px #0005}
#cl{position:fixed;top:calc(10px + env(safe-area-inset-top));right:14px;z-index:4;width:40px;height:40px;border-radius:13px;border:0;background:var(--card);box-shadow:var(--sh);font-size:19px;opacity:.65}#cl.ok{opacity:1;box-shadow:0 0 0 2px var(--ok)}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--bd)}
button,.c[onclick]{transition:transform .15s,box-shadow .15s,filter .15s}button:active{transform:scale(.96)}
@media(hover:hover){button{cursor:pointer}.btn:hover,.fab:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 14px 28px #0005;filter:brightness(1.1)}
nav button:hover,.chips button:hover,.seg button:hover,#cl:hover{transform:translateY(-3px);box-shadow:0 8px 18px #0003;opacity:1}.sw:hover{transform:scale(1.18)}.c[onclick]:hover{transform:translateY(-2px);box-shadow:0 10px 24px #0002}}
#app .fl{animation:fl 1.8s}@keyframes fl{0%,60%{box-shadow:0 0 0 3px var(--pr)}}
.mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:20px 2px 8px;flex-wrap:wrap}.mh b{font-size:16px}
summary{font-weight:700;cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}summary:after{content:"▾";float:right;color:var(--mu)}details[open] summary:after{content:"▴"}
.av,.hero,.g3 .c{cursor:pointer}nav span{font-size:19px}
</style></head><body>
<button id="cl" onclick="cloud()" title="Conexión con Firebase">☁️</button><main id="app"></main><button class="fab" id="fab" onclick="fab()">+</button><nav id="nav"></nav><div id="sh"></div><div id="to"></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),today=()=>new Date().toISOString().slice(0,10),ym=()=>today().slice(0,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),vis=a=>a.filter(x=>!x.del),srt=a=>[...a].sort((x,y)=>x.id<y.id?-1:1);
const rd=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
let D=rd('gd',{accs:[],txs:[],svcs:[],mem:[]}),cfg=rd('gc',{user:'',fb:''});D.mem=D.mem||[];cfg.home=cfg.home||{};
const CAT={Comida:'🛒',Hogar:'🏠',Servicios:'💡',Transporte:'🚗',Salud:'💊',Ocio:'🎉',Compras:'🛍️',Deudas:'💳',Sueldo:'💼',Otros:'📦'};
const TYP={corriente:['🏦','Cuenta corriente'],ahorro:['🐖','Caja de ahorro'],efectivo:['💵','Efectivo'],digital:['📱','Billetera digital'],tarjeta:['💳','Tarjeta de crédito'],prestamo:['🤝','Préstamo'],cuotas:['🛒','Objeto a cuotas'],seguro:['🩺','Seguro médico'],inversion:['📈','Fondo de inversión'],otra:['📌','Otra deuda']};
const fm=(n,c)=>(n<0?'−':'')+(c=='USD'?'US$ '+Math.abs(n).toLocaleString('es-PY',{minimumFractionDigits:2,maximumFractionDigits:2}):'₲ '+Math.round(Math.abs(n)).toLocaleString('es-PY'));
function num(s){s=String(s||'').trim().replace(/[^\d.,]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/\.\d{3}(\.|$)/.test(s))s=s.replace(/\./g,'');return parseFloat(s)||0}
function toast(m){const t=$('#to');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function sheet(h){$('#sh').innerHTML='<div class=bk onclick=closeS()></div><div class=pn>'+h+'</div>';$('#sh').classList.add('on')}
function closeS(){$('#sh').classList.remove('on')}
const fld=(l,i)=>`<label>${l}</label>${i}`;
/* ---------- datos + sync ---------- */
const ser=()=>JSON.stringify({accs:srt(D.accs),txs:srt(D.txs),svcs:srt(D.svcs),mem:srt(D.mem)});
function merge(r){for(const k of['accs','txs','svcs','mem']){const m=new Map(D[k].map(x=>[x.id,x]));(r[k]||[]).forEach(x=>{const l=m.get(x.id);if(!l||x.u>l.u)m.set(x.id,x)});D[k]=srt([...m.values()])}localStorage.setItem('gd',JSON.stringify(D))}
let db,ref,usr,unsub,st='Solo en este dispositivo',t0;
const em=e=>e.code=='unavailable'?'Sin conexión':'Error: '+(e.code||e.message);
function setSt(s){st=s;const c=$('#cl');if(c)c.className=s[0]=='✓'?'ok':''}
function save(){localStorage.setItem('gd',JSON.stringify(D));push()}
function push(){if(!ref)return;clearTimeout(t0);t0=setTimeout(()=>db.runTransaction(async t=>{const s=await t.get(ref);if(s.exists)merge(JSON.parse(s.data().d));t.set(ref,{d:ser()})}).then(()=>setSt('✓ Sincronizado')).catch(e=>{const m=em(e);if(st!=m)toast('Sincronización: '+m.replace('Error: ',''));setSt(m);setTimeout(push,20000)}),400)}
addEventListener('online',push);
const lsc=u=>new Promise((r,j)=>{const s=document.createElement('script');s.src=u;s.onload=r;s.onerror=j;document.head.appendChild(s)});
const VER='v8',pidIn=t=>{const m=t.match(/projectId["']?\s*:\s*["']([^"']+)/)||t.match(/authDomain["']?\s*:\s*["']([^."']+)\./);return m?m[1]:''},pidOf=()=>pidIn(cfg.fb||'');
function showPid(v){const e=$('#pid');if(e)e.value=pidIn(v)}
async function refreshApp(){try{for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();for(const k of await caches.keys())await caches.delete(k)}catch(e){}location.reload()}
function parseFb(t){const o={},K=['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId','measurementId'];
 for(const m of t.matchAll(/["']?(\w+)["']?\s*:\s*["']([^"']*)["']/g))if(K.includes(m[1]))o[m[1]]=m[2];
 if(!o.apiKey||!o.projectId)throw Error('La configuración está incompleta: faltan apiKey o projectId');return o}
async function boot(){if(!cfg.fb)throw Error('Primero configurá Firebase con el ícono ☁️');const B='https://www.gstatic.com/firebasejs/10.12.2/firebase-';
 if(!window.firebase){await lsc(B+'app-compat.js');await lsc(B+'auth-compat.js');await lsc(B+'firestore-compat.js')}
 if(!firebase.apps.length)firebase.initializeApp(parseFb(cfg.fb));db=firebase.firestore()}
async function initSync(){if(!cfg.fb||!on())return;try{setSt('Conectando…');await boot();
 usr=await new Promise(r=>{const o=firebase.auth().onAuthStateChanged(x=>{o();r(x)})});if(!usr)return setSt('Sesión vencida: volvé a ingresar');
 ref=db.collection('hogares').doc('hogar');unsub&&unsub();
 unsub=ref.onSnapshot(s=>{if(s.exists){merge(JSON.parse(s.data().d));render();if(s.data().d!=ser())push();else setSt('✓ Sincronizado')}else push()},e=>{setSt(em(e));toast('Sincronización: '+(e.code||e.message))})}catch(e){setSt(em(e))}}
function upsert(k,o){o.u=Date.now();const i=D[k].findIndex(x=>x.id==o.id);i<0?D[k].push(o):D[k][i]=o;save()}
function del(k,id){const o=D[k].find(x=>x.id==id);if(o&&confirm('¿Eliminar?')){o.del=1;upsert(k,o);render()}}
/* ---------- cálculos ---------- */
const acc=id=>D.accs.find(a=>a.id==id),me=()=>cfg.user?cfg.user[0].toUpperCase()+cfg.user.slice(1):'Yo';
function bal(a){let b=a.open||0;vis(D.txs).forEach(t=>{if(t.acc==a.id)b+=t.type=='ingreso'?t.amount:-t.amount;if(t.to==a.id)b+=t.toAmt||t.amount});return b}
const spend=(f,c)=>vis(D.txs).filter(t=>t.type=='gasto'&&t.date.startsWith(ym())&&acc(t.acc)?.cur==c&&f(t)).reduce((s,t)=>s+t.amount,0);
/* ---------- vistas ---------- */
let T='in',flt='all',F={};
const TABS=[['in','🏠','Inicio'],['mv','🧾','Movs'],['cu','👛','Cuentas'],['de','💳','Deudas'],['sv','💡','Servicios'],['aj','⚙️','Opciones']];
function render(){const lg=!on();$('#nav').style.display=lg?'none':'flex';$('#cl').style.display=lg?'block':'none';$('#app').style.paddingTop=lg?'':'22px';
 if(lg){$('#fab').style.display='none';$('#app').innerHTML=loginView();return}
 $('#app').innerHTML={in:home,mv:movs,cu:cuentas,de:deudas,sv:servs,aj:sets}[T]();
 $('#nav').innerHTML=TABS.map(([k,i,l])=>`<button class="${T==k?'on':''}" onclick="T='${k}';render()"><span>${i}</span>${l}</button>`).join('');$('#fab').style.display=T=='aj'?'none':'block'}
function fab(){({in:newTx,mv:newTx,cu:()=>newAcc('cta'),de:()=>newAcc('deu'),sv:newSvc})[T]()}
const on=()=>sessionStorage.getItem('ses')=='1'&&cfg.user,MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'],mlab=m=>MES[+m.slice(5)-1]+' '+m.slice(0,4);
const part=()=>(D.mem.find(x=>x.id!=me())||{}).id||'Tu pareja',deb=a=>['tarjeta','prestamo','cuotas','seguro','inversion','otra'].includes(a.type);
const sum=(L,ty,c)=>L.filter(t=>t.type==ty&&(acc(t.acc)?.cur||t.cur)==c).reduce((s,t)=>s+t.amount,0);
const emp=(i,t)=>`<div class=em>${i}<p>${t}</p></div>`;
function ensureMem(){if(!D.mem.some(x=>x.id==me()))upsert('mem',{id:me()})}
function owes(){const m=me(),r={PYG:0,USD:0};vis(D.txs).forEach(t=>{if(t.type=='gasto'&&t.scope=='shared'&&t.pays&&t.pays!='me'){const c=acc(t.acc)?.cur||'PYG',x=t.pays=='half'?t.amount/2:t.amount;r[c]+=t.by==m?x:-x}if(t.type=='saldo')r[t.cur]+=t.by==m?t.amount:-t.amount});return r}
function saldar(c){const r=owes()[c];if(r<0&&confirm('¿Registrar que le pagaste '+fm(-r,c)+' a '+part()+'?')){upsert('txs',{id:uid(),date:today(),type:'saldo',amount:-r,cur:c,acc:'',cat:'Saldo',note:'Pago entre ustedes',scope:'shared',by:me()});render()}}
function go(t,o={}){T=t;if(o.f)flt=o.f;render();if(o.id){const e=document.getElementById('i_'+o.id);if(e){e.scrollIntoView({block:'center'});e.classList.add('fl')}}}
const HS=[['hero','Tu dinero'],['gastos','Gastos del mes'],['ust','Cuentas entre ustedes'],['deu','Deudas'],['serv','Servicios por pagar']],hv=k=>cfg.home[k]!==0;
function homeOpts(){sheet(`<h3>Personalizar inicio</h3><p class=mu>Elegí qué querés ver en la pantalla de inicio.</p>${HS.map(([k,l])=>`<label class=row style="font-size:15px;color:var(--tx);margin:12px 0"><span>${l}</span><input type=checkbox style="width:24px;height:24px" ${hv(k)?'checked':''} onchange="cfg.home['${k}']=this.checked?1:0;localStorage.setItem('gc',JSON.stringify(cfg));render()"></label>`).join('')}<button class=btn onclick="closeS()">Listo</button>`)}
function home(){const A=vis(D.accs),net=c=>A.filter(a=>!deb(a)&&a.cur==c).reduce((s,a)=>s+bal(a),0),h=new Date().getHours(),dd=new Date().getDate(),
 two=f=>{const u=spend(f,'USD');return fm(spend(f,'PYG'),'PYG')+(u?`<div class=mu>${fm(u,'USD')}</div>`:'')},r=owes(),
 pend=vis(D.svcs).filter(s=>s.paid!=ym()).sort((a,b)=>a.day-b.day),ds=A.filter(a=>deb(a)&&bal(a)<0),st=t=>`<div class=st>${t}</div>`;
 const g=(f,dot,l,fn)=>`<div class=c onclick="go('mv',{f:'${f}'})"><div class=mu><i class="dot ${dot}"></i>${l}</div><b>${two(fn)}</b></div>`;
 return `<div class=top><div><div class=mu>${h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches'}</div><h1>${esc(me())} 👋</h1></div><div class=av onclick="homeOpts()" title="Personalizar inicio">${esc(me()[0]||'?').toUpperCase()}</div></div>`
 +(hv('hero')?`<div class=hero onclick="go('cu')"><div class=mu>Tu dinero</div><div class=big>${fm(net('PYG'),'PYG')}</div><div class=u>${fm(net('USD'),'USD')}</div></div>`:'')
 +(hv('gastos')?st('Gastos de '+MES[+ym().slice(5)-1])+`<div class=g3>${g('shared','v','Compartidos',t=>t.scope=='shared')}${g('mine','','Míos',t=>t.scope=='personal'&&t.by==me())}${g('part','a','Pareja',t=>t.scope=='personal'&&t.by!=me())}</div>`:'')
 +(hv('ust')?st('Entre ustedes')+(['PYG','USD'].filter(c=>Math.abs(r[c])>.5).map(c=>`<div class="c row" onclick="go('mv',{f:'shared'})"><div class=ic>🤝</div><div style="flex:1"><b>${r[c]>0?esc(part())+' te debe':'Le debés a '+esc(part())}</b><div class=mu>por gastos compartidos</div></div><div style="text-align:right"><b>${fm(Math.abs(r[c]),c)}</b>${r[c]<0?`<br><button class="btn s" style="margin-top:4px" onclick="event.stopPropagation();saldar('${c}')">Saldar</button>`:''}</div></div>`).join('')||`<div class=c><span class=mu>Están a mano ✓</span></div>`):'')
 +(hv('deu')?st('Deudas')+(ds.map(a=>`<div class="c row" onclick="go('de',{id:'${a.id}'})"><div class="ic d">${TYP[a.type][0]}</div><div style="flex:1;min-width:0"><b>${esc(a.name)}</b><div class=mu>${TYP[a.type][1]}${a.dueDay?' · vence día '+a.dueDay:''}</div></div><b class=neg>${fm(bal(a),a.cur)}</b></div>`).join('')||`<div class=c><span class=mu>Sin deudas ✓</span></div>`):'')
 +(hv('serv')?st('Servicios por pagar')+(pend.map(s=>`<div class="c row" onclick="go('sv',{id:'${s.id}'})"><div class="ic ${s.scope=='shared'?'v':''}">💡</div><div style="flex:1"><b>${esc(s.name)}</b><div class=mu>Día ${s.day} ${s.day<dd?'<span class=neg>· vencido</span>':''}</div></div><div style="text-align:right"><b>${fm(s.amount,s.cur)}</b><br><button class="btn s" style="margin-top:4px" onclick="event.stopPropagation();payS('${s.id}')">Pagar</button></div></div>`).join('')||`<div class=c><span class=mu>Todo al día ✓</span></div>`):'')}
function txRow(t){const a=acc(t.acc),tr=t.type=='transferencia',sd=t.type=='saldo',cur=a?.cur||t.cur,sg=t.type=='ingreso'?'+':tr||sd?'⇄ ':'−',sh=t.scope=='shared'&&!tr&&!sd;
 return `<div class="c row" onclick="del('txs','${t.id}')"><div class="ic ${sh?'v':''}">${sd?'🤝':tr?'⇄':CAT[t.cat]||'📦'}</div><div style="flex:1;min-width:0"><b>${esc(t.note||t.cat)}</b><div class=mu>${t.date.slice(8)}/${t.date.slice(5,7)}${a?' · '+esc(a.name):''}${tr?' → '+esc(acc(t.to)?.name):''} · ${esc(t.by)} ${sh?`<span class=tag>Compartido${t.pays=='half'?' · 50/50':t.pays=='other'?' · paga pareja':''}</span>`:''}</div></div><b class="${t.type=='ingreso'?'pos':''}">${sg}${fm(t.amount,cur).replace('−','')}</b></div>`}
function movs(){const L=vis(D.txs).sort((a,b)=>b.date.localeCompare(a.date)||b.u-a.u).filter(t=>flt=='all'||(flt=='shared'&&t.scope=='shared')||(flt=='mine'&&t.scope=='personal'&&t.by==me())||(flt=='part'&&t.scope=='personal'&&t.by!=me())),g={};
